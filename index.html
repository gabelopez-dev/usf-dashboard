<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>USF Recruiting — Mini Bull Pen Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg:#f7f6f3;--surface:#ffffff;--surface2:#f0efe9;
    --border:rgba(0,0,0,0.09);--border-md:rgba(0,0,0,0.15);
    --text:#1a1916;--text2:#6b6a66;--text3:#9e9d99;
    --blue:#185FA5;--green:#3B6D11;--amber:#BA7517;
    --red:#A32D2D;--teal:#0F6E56;
    --radius:10px;--radius-sm:6px;--radius-pill:99px;
    --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
    --nav-h:52px;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg:#141412;--surface:#1e1d1b;--surface2:#262523;
      --border:rgba(255,255,255,0.08);--border-md:rgba(255,255,255,0.14);
      --text:#f0efe9;--text2:#a09f9b;--text3:#5e5d59;
    }
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;}
  .nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:4px;padding:0 16px;height:var(--nav-h);background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;overflow-x:auto;}
  .nav-logo{font-size:14px;font-weight:500;color:var(--text);margin-right:10px;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:6px;}
  .nav-logo .usf{color:var(--green);}
  .nav-sync{font-size:10px;color:var(--text3);margin-left:auto;font-family:var(--mono);white-space:nowrap;flex-shrink:0;}
  .nav-sync .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px;vertical-align:middle;}
  .nav-btn{padding:5px 12px;border-radius:var(--radius-pill);border:1px solid var(--border-md);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;background:transparent;color:var(--text2);white-space:nowrap;flex-shrink:0;transition:all .15s ease;}
  .nav-btn:hover{background:var(--surface2);color:var(--text);}
  .nav-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .nav-btn.home{display:flex;align-items:center;gap:5px;}
  .nav-btn.home svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;}
  .view{display:none;padding:18px;flex-direction:column;gap:14px;animation:fadeIn .2s ease;}
  .view.active{display:flex;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .row{display:grid;gap:12px;}
  .r4{grid-template-columns:repeat(4,minmax(0,1fr));}
  .r3{grid-template-columns:repeat(3,minmax(0,1fr));}
  .r2{grid-template-columns:repeat(2,minmax(0,1fr));}
  @media(max-width:900px){.r4{grid-template-columns:repeat(2,minmax(0,1fr));}.r3{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media(max-width:540px){.r4,.r3,.r2{grid-template-columns:1fr;}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .card-label{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  .kval{font-size:26px;font-weight:500;line-height:1;}
  .kunit{font-size:11px;color:var(--text3);margin-top:3px;}
  .pill{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;border-radius:var(--radius-pill);font-size:11px;font-weight:500;margin-bottom:5px;}
  .aband{display:flex;align-items:center;justify-content:space-between;padding:5px 9px;border-radius:var(--radius-sm);font-size:11px;font-weight:500;margin-bottom:4px;}
  .btrack{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:9px;}
  .bfill{height:100%;border-radius:99px;}
  .fstage{display:flex;align-items:center;justify-content:space-between;border-radius:var(--radius-sm);padding:5px 10px;font-size:11px;font-weight:500;margin:0 auto 3px;}
  .team-row{display:flex;align-items:center;gap:9px;padding:7px 6px;border-radius:var(--radius-sm);cursor:pointer;transition:background .12s;border-bottom:1px solid var(--border);}
  .team-row:last-child{border-bottom:none;}
  .team-row:hover{background:var(--surface2);}
  .av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;flex-shrink:0;}
  .av-lg{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;flex-shrink:0;}
  .rh{display:flex;align-items:center;gap:12px;margin-bottom:2px;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .rh-name{font-size:17px;font-weight:500;color:var(--text);}
  .rh-sub{font-size:11px;color:var(--text3);margin-top:1px;}
  .goal-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .goal-label{font-size:11px;color:var(--text2);width:78px;flex-shrink:0;}
  .goal-track{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;}
  .goal-fill{height:100%;border-radius:99px;transition:width .5s ease;}
  .goal-val{font-size:11px;font-weight:500;color:var(--text);width:38px;text-align:right;font-family:var(--mono);}
  .leg{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:8px;}
  .li{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2);}
  .ld{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .section-title{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
  .back-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);cursor:pointer;padding:3px 8px;border-radius:var(--radius-pill);border:1px solid var(--border-md);background:transparent;font-family:var(--font);transition:all .12s;}
  .back-chip:hover{background:var(--surface2);}
  .loading{display:flex;align-items:center;justify-content:center;height:200px;font-size:13px;color:var(--text3);}
  .error-banner{background:#FCEBEB;border:1px solid #A32D2D33;border-radius:var(--radius);padding:12px 16px;font-size:12px;color:#A32D2D;margin:18px;}
</style>
</head>
<body>

<nav class="nav" role="navigation" aria-label="Dashboard navigation">
  <div class="nav-logo"><span class="usf">USF</span> Recruiting</div>
  <button class="nav-btn home active" onclick="showView('main')" aria-label="Main dashboard">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Main
  </button>
  <div id="nav-recruiter-btns"></div>
  <span class="nav-sync" id="nav-sync"></span>
</nav>

<div id="app">
  <div class="loading">Loading dashboard data...</div>
</div>

<script>
const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
let DATA = null;

async function loadData() {
  try {
    const res = await fetch('data.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
    initDashboard();
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="error-banner">Could not load data.json — make sure the file is in the same folder as index.html in your GitHub repo. (${e.message})</div>`;
  }
}

function initDashboard() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const sync = document.getElementById('nav-sync');
  if (DATA.lastUpdated) {
    const d = new Date(DATA.lastUpdated);
    sync.innerHTML = `<span class="dot"></span>Updated ${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})} ${d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`;
  }

  const navBtns = document.getElementById('nav-recruiter-btns');
  navBtns.innerHTML = '';
  DATA.recruiters.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.textContent = r.name;
    btn.onclick = () => goToRecruiter(r.id);
    navBtns.appendChild(btn);
  });

  buildMainView(app);
  DATA.recruiters.forEach(r => {
    const el = document.createElement('div');
    el.id = 'view-' + r.id;
    el.className = 'view';
    app.appendChild(el);
  });

  showView('main');
}

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('view-' + id);
  if (el) el.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => {
    const t = b.textContent.trim();
    if (id === 'main' && (t === 'Main' || b.classList.contains('home'))) b.classList.add('active');
    else { const r = DATA.recruiters.find(r => r.name === t); if (r && r.id === id) b.classList.add('active'); }
  });
  window.scrollTo(0, 0);
}

function buildMainView(app) {
  const s = DATA.summary;
  const main = document.createElement('div');
  main.id = 'view-main';
  main.className = 'view';
  main.innerHTML = `
    <div class="row r4">
      <div class="card"><div class="card-label">Open reqs</div><div class="kval" style="color:var(--blue);">${s.openReqs}</div><div class="kunit">all campuses &amp; units</div></div>
      <div class="card"><div class="card-label">Avg time to fill</div><div class="kval">${s.avgTimeToFill}<span style="font-size:14px;color:var(--text2);font-weight:400;">d</span></div><div class="kunit">days avg (active)</div></div>
      <div class="card"><div class="card-label">Filled YTD</div><div class="kval" style="color:var(--green);">${s.filledYTD}</div><div class="kunit">positions closed</div></div>
      <div class="card"><div class="card-label">Failed / cancelled</div><div class="kval" style="color:var(--red);">${s.failedCancelled}</div><div class="kunit">searches no hire</div></div>
    </div>
    <div class="row r2">
      <div class="card">
        <div class="section-title">Recruiter load — open reqs</div>
        <div style="position:relative;height:${DATA.recruiters.length * 38 + 60}px;">
          <canvas id="recBar" role="img" aria-label="Recruiter open req counts">${DATA.recruiters.map(r=>r.name+' '+r.reqs).join(', ')}</canvas>
        </div>
      </div>
      <div class="card">
        <div class="section-title">Pipeline funnel — all recruiters</div>
        <div id="main-funnel" style="margin-top:4px;"></div>
      </div>
    </div>
    <div class="row r3">
      <div class="card">
        <div class="section-title">Jobs by campus</div>
        <div style="position:relative;height:150px;"><canvas id="campusPie" role="img" aria-label="Jobs by campus donut chart">${DATA.campus.map(c=>c.label+' '+c.count).join(', ')}</canvas></div>
        <div class="leg" id="campus-leg"></div>
      </div>
      <div class="card"><div class="section-title">Aging bands</div><div id="main-aging"></div></div>
      <div class="card"><div class="section-title">Team — click to drill in</div><div id="main-team"></div></div>
    </div>`;
  app.appendChild(main);

  setTimeout(() => {
    new Chart(document.getElementById('recBar'), {
      type:'bar',
      data:{
        labels: DATA.recruiters.map(r => r.name),
        datasets:[{
          label:'Open reqs',
          data: DATA.recruiters.map(r => r.reqs),
          backgroundColor: DATA.recruiters.map(r => r.color),
          borderRadius:5, borderSkipped:false
        }]
      },
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.raw} reqs`}}},scales:{x:{beginAtZero:true,ticks:{stepSize:1,font:{size:10,family:"'DM Mono',monospace"},color:isDark?'#6b6a66':'#9e9d99'},grid:{color:isDark?'rgba(255,255,255,.05)':'rgba(0,0,0,.05)'}},y:{ticks:{font:{size:11},color:isDark?'#a09f9b':'#6b6a66'},grid:{display:false}}}}
    });

    new Chart(document.getElementById('campusPie'), {
      type:'doughnut',
      data:{labels:DATA.campus.map(c=>c.label),datasets:[{data:DATA.campus.map(c=>c.count),backgroundColor:DATA.campus.map(c=>c.color),borderWidth:2,borderColor:isDark?'#1e1d1b':'#fff'}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'62%'}
    });

    const legEl = document.getElementById('campus-leg');
    DATA.campus.forEach(c => {
      legEl.innerHTML += `<span class="li"><span class="ld" style="background:${c.color};"></span>${c.label} ${c.count}</span>`;
    });

    buildFunnel(document.getElementById('main-funnel'), DATA.mainFunnel);
    buildAging(document.getElementById('main-aging'), DATA.mainAging, DATA.summary.openReqs);

    const teamEl = document.getElementById('main-team');
    DATA.recruiters.forEach(r => {
      const row = document.createElement('div'); row.className = 'team-row';
      row.setAttribute('role','button'); row.setAttribute('tabindex','0');
      const bg = isDark ? r.bgDark : r.bgLight;
      row.innerHTML = `<div class="av" style="background:${bg};color:${r.color};">${r.initials}</div><span style="font-size:12px;flex:1;">${r.name}</span><span style="font-size:11px;color:var(--text3);font-family:var(--mono);">${r.reqs} reqs</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>`;
      row.onclick = () => goToRecruiter(r.id);
      row.onkeydown = e => { if(e.key==='Enter'||e.key===' ') goToRecruiter(r.id); };
      teamEl.appendChild(row);
    });
  }, 50);
}

function goToRecruiter(id) {
  const r = DATA.recruiters.find(x => x.id === id);
  if (!r) return;
  const el = document.getElementById('view-' + id);
  if (!el.dataset.built) buildRecruiterView(r, el);
  showView(id);
}

function buildRecruiterView(r, el) {
  el.dataset.built = '1';
  el.innerHTML = '';
  const bg = isDark ? r.bgDark : r.bgLight;

  const backRow = document.createElement('div');
  backRow.style.marginBottom = '4px';
  backRow.innerHTML = `<button class="back-chip" onclick="showView('main')">&#8592; Back to main</button>`;
  el.appendChild(backRow);

  const header = document.createElement('div'); header.className = 'rh card';
  header.innerHTML = `<div class="av-lg" style="background:${bg};color:${r.color};">${r.initials}</div><div><div class="rh-name">${r.name}</div><div class="rh-sub">${r.campus} &middot; Recruiting Partner &middot; ${r.reqs} open reqs</div></div>`;
  el.appendChild(header);

  const kpis = document.createElement('div'); kpis.className = 'row r4';
  [{l:'Open reqs',v:r.reqs,c:'var(--blue)'},{l:'Filled YTD',v:r.filled,c:'var(--green)'},{l:'Failed / cancelled',v:r.failed,c:'var(--red)'},{l:'Avg time to fill',v:r.ttf+'d',c:'var(--text)'}].forEach(k => {
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `<div class="card-label">${k.l}</div><div class="kval" style="color:${k.c};">${k.v}</div>`;
    kpis.appendChild(c);
  });
  el.appendChild(kpis);

  const mid = document.createElement('div'); mid.className = 'row r3';

  const sc = document.createElement('div'); sc.className = 'card';
  sc.innerHTML = '<div class="section-title">Status breakdown</div>';
  buildStatuses(sc, r.statuses);
  mid.appendChild(sc);

  const fc = document.createElement('div'); fc.className = 'card';
  fc.innerHTML = '<div class="section-title">Pipeline funnel</div>';
  const fd = document.createElement('div'); fd.style.marginTop = '4px';
  buildFunnel(fd, r.funnel);
  fc.appendChild(fd);
  mid.appendChild(fc);

  const ac = document.createElement('div'); ac.className = 'card';
  ac.innerHTML = '<div class="section-title">Aging bands</div>';
  const ad = document.createElement('div'); ad.style.marginTop = '4px';
  buildAging(ad, r.aging, r.reqs);
  ac.appendChild(ad);
  mid.appendChild(ac);
  el.appendChild(mid);

  const bot = document.createElement('div'); bot.className = 'row r2';

  const gc = document.createElement('div'); gc.className = 'card';
  gc.innerHTML = '<div class="section-title">Goal progress</div>';
  const gd = document.createElement('div'); gd.style.marginTop = '10px';
  buildGoals(gd, r.goals);
  gc.appendChild(gd);
  bot.appendChild(gc);

  const cid = 'trend-' + r.id;
  const tc = document.createElement('div'); tc.className = 'card';
  tc.innerHTML = `<div class="section-title">Time to fill — 6 month trend</div><div style="position:relative;height:170px;margin-top:6px;"><canvas id="${cid}" role="img" aria-label="Time to fill trend for ${r.name}">${r.trend.join(', ')} days</canvas></div>`;
  bot.appendChild(tc);
  el.appendChild(bot);

  setTimeout(() => {
    new Chart(document.getElementById(cid), {
      type:'line',
      data:{labels:['Jan','Feb','Mar','Apr','May','Jun'],datasets:[{label:'Days to fill',data:r.trend,borderColor:r.color,backgroundColor:r.color+'22',fill:true,tension:.4,pointRadius:4,pointBackgroundColor:r.color,pointBorderColor:isDark?'#1e1d1b':'#fff',pointBorderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:false,ticks:{font:{size:10,family:"'DM Mono',monospace"},color:isDark?'#6b6a66':'#9e9d99'},grid:{color:isDark?'rgba(255,255,255,.05)':'rgba(0,0,0,.05)'}},x:{ticks:{font:{size:10},color:isDark?'#6b6a66':'#9e9d99'},grid:{display:false}}}}
    });
  }, 30);
}

function buildFunnel(container, stages) {
  stages.forEach((s, i) => {
    const w = Math.max(36, 100 - i * 13);
    const alpha = 0.11 + i * 0.14;
    const el = document.createElement('div'); el.className = 'fstage';
    el.style.cssText = `width:${w}%;background:rgba(24,95,165,${alpha});color:${isDark?'#85B7EB':'#0C447C'};`;
    el.innerHTML = `<span>${s.label}</span><span style="font-family:var(--mono);">${s.count}</span>`;
    container.appendChild(el);
  });
}

function buildAging(container, aging, total) {
  aging.forEach(a => {
    const bg = isDark ? a.bgDark : a.bgLight;
    const badge = document.createElement('div'); badge.className = 'aband';
    badge.style.cssText = `background:${bg};color:${a.color};border:1px solid ${a.color}33;`;
    badge.innerHTML = `<span>${a.label}</span><span style="font-family:var(--mono);font-size:13px;">${a.count}</span>`;
    container.appendChild(badge);
    const track = document.createElement('div'); track.className = 'btrack';
    const fill = document.createElement('div'); fill.className = 'bfill';
    fill.style.cssText = `background:${a.color};width:${total > 0 ? Math.round((a.count/total)*100) : 0}%;`;
    track.appendChild(fill); container.appendChild(track);
  });
}

function buildStatuses(container, statuses) {
  statuses.forEach(s => {
    const pill = document.createElement('div'); pill.className = 'pill';
    pill.style.cssText = `background:${s.color}20;color:${s.color};border:1px solid ${s.color}33;`;
    pill.innerHTML = `<span>${s.label}</span><span style="font-family:var(--mono);">${s.count}</span>`;
    container.appendChild(pill);
  });
}

function buildGoals(container, goals) {
  goals.forEach(g => {
    const pct = g.invert ? Math.round(Math.min(100,(g.target/g.value)*100)) : Math.round(Math.min(100,(g.value/g.target)*100));
    const color = pct >= 75 ? '#3B6D11' : pct >= 50 ? '#BA7517' : '#A32D2D';
    const row = document.createElement('div'); row.className = 'goal-row';
    row.innerHTML = `<span class="goal-label">${g.label}</span><div class="goal-track"><div class="goal-fill" style="width:${pct}%;background:${color};"></div></div><span class="goal-val">${g.value}${g.invert?' d':''}</span>`;
    container.appendChild(row);
  });
}

loadData();
</script>
</body>
</html>
