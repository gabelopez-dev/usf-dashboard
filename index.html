<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHR Recruiting Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f3f0; color: #1a1a1a; font-size: 13px; }
:root {
  --usf-green-dark:  #004d35;
  --usf-green:       #006747;
  --usf-green-mid:   #1B7A5A;
  --usf-green-light: #e6f2ed;
  --usf-teal-dark:   #1B6A9C;
  --usf-teal:        #00A693;
  --usf-teal-light:  #5B8FA8;
  --usf-teal-muted:  #7A9EB5;
  --usf-slate:       #5B7A8A;
  --usf-slate-dark:  #3A5A6A;
  --usf-gold:        #CFC483;
  --usf-gold-dark:   #B8A84A;
  --bg:              #f4f3f0;
  --surface:         #ffffff;
  --border:          #e8e7e3;
  --text:            #1a1a1a;
  --text-muted:      #888;
}
.header { background: var(--usf-green); padding: 0 16px; display: flex; align-items: center; justify-content: center; height: 100px; position: relative; }
.header-right { font-size: 11px; color: rgba(255,255,255,0.6); position: absolute; right: 16px; }
.nav { background: #1a1a1a; border-bottom: 3px solid #111; padding: 0 16px; display: flex; align-items: flex-end; gap: 3px; overflow-x: auto; }
.nav-tab { font-size: 12px; font-weight: 700; padding: 10px 22px 10px 16px; color: #fff; cursor: pointer; white-space: nowrap; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); transition: all .15s; opacity: 0.70; letter-spacing: 0.02em; }
.nav-tab:hover { opacity: 1; transform: translateY(-2px); }
.nav-tab.active { opacity: 1; transform: translateY(-3px); filter: brightness(1.2); }
.content { padding: 14px 16px; }
.page { display: none; }
.kpi-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; border-top: 3px solid var(--usf-green); }
.kpi:nth-child(2) { border-top-color: var(--usf-teal); }
.kpi:nth-child(3) { border-top-color: var(--usf-gold); }
.kpi:nth-child(4) { border-top-color: #c0392b; }
.kpi:nth-child(5) { border-top-color: var(--usf-teal-dark); }
.kpi-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 4px; }
.kpi-val { font-size: 32px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; color: var(--text); }
.kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.kpi-val-green { color: var(--usf-green); }
.kpi-val-red { color: #c0392b; }
.kpi-val-amber { color: var(--usf-gold-dark); }
.kpi-val-blue { color: var(--usf-teal-dark); }
.row { display: grid; gap: 10px; margin-bottom: 10px; }
.row-2-1 { grid-template-columns: 2fr 1fr; }
.row-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
.row-half { grid-template-columns: 1fr 1fr; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.card-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 10px; }
.vbar-wrap { display: flex; align-items: flex-end; justify-content: space-around; height: 140px; gap: 8px; padding: 0 4px; }
.vbar-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
.vbar-count { font-size: 11px; font-weight: 700; color: var(--text); }
.vbar-bar-wrap { width: 100%; display: flex; align-items: flex-end; height: 110px; }
.vbar-bar { width: 100%; border-radius: 4px 4px 0 0; transition: height .4s ease; }
.vbar-name { font-size: 10px; color: var(--text-muted); text-align: center; margin-top: 4px; }
.vbar-pending { background: repeating-linear-gradient(45deg,#f0efeb,#f0efeb 3px,#e5e4e0 3px,#e5e4e0 6px); border-radius: 4px 4px 0 0; opacity: 0.5; }
.donut-wrap { position: relative; width: 130px; height: 130px; margin: 0 auto 8px; }
.donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }
.donut-center-num { font-size: 20px; font-weight: 700; color: var(--text); line-height: 1; }
.donut-center-lbl { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #555; }
.legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.donut-pending { display: flex; align-items: center; justify-content: center; width: 130px; height: 130px; margin: 0 auto 8px; border-radius: 50%; border: 3px dashed #e0dfdb; }
.donut-pending-text { font-size: 10px; color: #bbb; text-align: center; line-height: 1.4; padding: 10px; }
.heat-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.heat-table th { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding: 4px 6px; text-align: center; border-bottom: 1px solid var(--border); }
.heat-table th:first-child { text-align: left; }
.heat-table td { padding: 5px 6px; text-align: center; border-bottom: 1px solid #f0efeb; font-weight: 600; }
.heat-table td:first-child { text-align: left; font-weight: 400; color: #555; font-size: 11px; }
.heat-table tr:last-child td { border-bottom: none; font-weight: 700; background: #fafaf8; }
.heat-low { background: #c8e6c9; color: #1b5e20; border-radius: 3px; padding: 1px 5px; }
.heat-med { background: #fff9c4; color: #f57f17; border-radius: 3px; padding: 1px 5px; }
.heat-high { background: #ffcdd2; color: #b71c1c; border-radius: 3px; padding: 1px 5px; }
.heat-none { color: #ccc; }
.heat-legend { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 10px; color: var(--text-muted); }
.heat-swatch { width: 10px; height: 10px; border-radius: 2px; }
.funnel-step { margin-bottom: 5px; }
.funnel-bar { border-radius: 4px; height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; transition: width .4s ease; }
.funnel-bar-label { font-size: 11px; font-weight: 500; }
.funnel-bar-count { font-size: 12px; font-weight: 700; }
.detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.detail-avatar { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
.detail-name { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.detail-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.pill { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; }
.pill-red   { background: #ffebee; color: #c62828; }
.pill-green { background: var(--usf-green-light); color: var(--usf-green-dark); }
.pill-blue  { background: #e3f2fd; color: var(--usf-teal-dark); }
.pill-teal  { background: #e0f5f3; color: #006657; }
.pill-gold  { background: #f9f5e3; color: #7a6820; }
.pill-gray  { background: #f0efeb; color: #555; }
.pending-note { font-size: 10px; color: #bbb; font-style: italic; margin-top: 8px; }
.loading { text-align: center; padding: 60px; color: #999; font-size: 14px; }
.error-box { background: #fff3cd; border: 1px solid #f5c842; border-radius: 8px; padding: 14px; margin: 14px; font-size: 12px; color: #7a4f00; }
.error-box code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 3px; }

/* Drill-down panel */
.drill-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); z-index: 999; }
.drill-overlay.open { display: block; }
.drill-panel { position: fixed; top: 0; right: -100%; width: 680px; max-width: 95vw; height: 100%; background: var(--surface); box-shadow: -4px 0 24px rgba(0,0,0,0.15); z-index: 1000; transition: right .3s ease; overflow-y: auto; }
.drill-panel.open { right: 0; }
.drill-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.drill-title { font-size: 15px; font-weight: 700; color: var(--text); }
.drill-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.drill-close { width: 32px; height: 32px; border-radius: 6px; background: #f0efeb; border: none; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; color: #555; }
.drill-close:hover { background: #e0dfdb; }
.drill-body { padding: 16px 20px; }
.drill-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.drill-table th { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; background: #fafaf8; position: sticky; top: 0; }
.drill-table td { padding: 8px 10px; border-bottom: 1px solid #f0efeb; color: var(--text); vertical-align: middle; }
.drill-table tr:last-child td { border-bottom: none; }
.drill-table tr:hover td { background: var(--usf-green-light); cursor: default; }
.drill-empty { text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px; }
.heat-row-clickable { cursor: pointer; transition: background .1s; }
.heat-row-clickable:hover { background: var(--usf-green-light); }
/* ── MOBILE RESPONSIVE ─────────────────────────────────── */
@media (max-width: 768px) {

  /* Content padding */
  .content { padding: 10px 8px; }

  /* KPI row — 2 columns on mobile */
  .kpi-row { grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi-val { font-size: 24px; }

  /* All multi-column rows collapse to single column */
  .row, .row-half, .row-4, .row-2-1 { grid-template-columns: 1fr !important; }

  /* Campus+ReqType / Heatmap split layout */
  div[style*="grid-template-columns:1fr 1fr"] { grid-template-columns: 1fr !important; }

  /* Nav tabs — scrollable, smaller text */
  .nav { padding: 0 8px; gap: 2px; }
  .nav-tab { font-size: 10px; padding: 8px 14px 8px 10px; }

  /* Header */
  .header { padding: 10px; }
  .header img { height: 44px; }
  .sync-time { font-size: 9px; }

  /* Cards */
  .card { padding: 10px 12px; }
  .card-title { font-size: 9px; }

  /* Recruiter load bar chart */
  .bar-chart-wrap { overflow-x: auto; }

  /* Donuts — slightly smaller */
  .donut-wrap { width: 110px; height: 110px; }
  .donut-center-num { font-size: 17px; }

  /* Funnel bars — prevent overflow */
  .funnel-bar { min-width: 0; height: 24px; }
  .funnel-bar-label { font-size: 10px; }
  .funnel-bar-count { font-size: 11px; }

  /* Dept bar chart — label width smaller */
  .dept-bar-row span:first-child { width: 140px !important; }

  /* Avg time in stage label */
  div[style*="width:160px"] { width: 100px !important; }

  /* Drill-down panel — full screen on mobile */
  .drill-panel { width: 100% !important; max-width: 100% !important; }

  /* Detail header on recruiter pages */
  .detail-header { flex-wrap: wrap; gap: 10px; }
  .detail-header a[href] { margin-left: 0 !important; width: 100%; justify-content: center; }

  /* Stage conversion row-half */
  .row-half { grid-template-columns: 1fr !important; }

  /* Tables — allow horizontal scroll */
  .drill-table, .req-table { font-size: 11px; }
  div[style*="overflow-x:auto"] { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* Heat table */
  .heat-table { font-size: 10px; }
  .heat-table td, .heat-table th { padding: 4px 4px; }

  /* Legend wraps more tightly */
  .legend { gap: 3px 8px; }
  .legend-item { font-size: 9px; }

  /* KPI rows on recruiter pages */
  .kpi-row-recruiter { grid-template-columns: 1fr 1fr !important; }
}

@media (max-width: 480px) {
  /* Phones — single column KPIs */
  .kpi-row { grid-template-columns: 1fr 1fr; gap: 6px; }
  .kpi { padding: 10px; }
  .kpi-val { font-size: 22px; }
  .kpi-label { font-size: 9px; }
  .nav-tab { font-size: 9px; padding: 7px 10px 7px 8px; }
  .dept-bar-row span:first-child { width: 110px !important; }
}

</style>
</head>

<script>
const TAB_COLORS = ['#006747', '#1B7A5A', '#1B6A9C', '#5B8FA8', '#00A693', '#7A9EB5', '#3A5A6A', '#534AB7'];
let DASHBOARD_DATA = null;
const charts = {};

function showPage(tabEl) {
  document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  const id = tabEl.getAttribute('data-page');
  const target = document.getElementById('page-' + id);
  if (target) target.style.display = 'block';
  tabEl.classList.add('active');
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function buildDonut(canvasId, labels, values, colors) {
  if (charts[canvasId]) charts[canvasId].destroy();
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  charts[canvasId] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
    options: { responsive: true, maintainAspectRatio: false, cutout: '68%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' ' + ctx.label + ': ' + ctx.parsed } } } }
  });
}

function legendHTML(items) {
  return items.map(i => `<div class="legend-item"><div class="legend-dot" style="background:${i.color};"></div>${i.label} ${i.count}</div>`).join('');
}

function renderMainPage(data) {
  const s = data.summary || {};
  const recruiters = data.recruiters || [];

  let html = `
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-label">Open Reqs</div><div class="kpi-val kpi-val-green">${s.openReqs ?? 0}</div><div class="kpi-sub">active pipeline</div></div>
    <div class="kpi"><div class="kpi-label">Avg Time to Fill</div><div class="kpi-val">${s.avgTimeToFill ?? 0}d</div><div class="kpi-sub">days avg (active)</div></div>
    <div class="kpi"><div class="kpi-label">Filled YTD</div><div class="kpi-val">${s.filledYTD ?? 0}</div><div class="kpi-sub">positions closed</div></div>
    <div class="kpi"><div class="kpi-label">Failed / Cancelled</div><div class="kpi-val kpi-val-red">${s.failedCancelled ?? 0}</div><div class="kpi-sub">searches no hire</div></div>
    <div class="kpi"><div class="kpi-label">In Offer Stage</div><div class="kpi-val kpi-val-blue">${s.inOfferStage ?? 0}</div><div class="kpi-sub">active offers</div></div>
  </div>`;

  // Recruiter load vertical bars
  const maxReqs = Math.max(...recruiters.map(r => r.reqs || 0), 1);
  const vbarCols = recruiters.map(r => {
    const hasData = (r.reqs || 0) > 0;
    const heightPx = hasData ? Math.max(8, Math.round((r.reqs / maxReqs) * 110)) : 8;
    const barStyle = hasData ? `height:${heightPx}px; width:100%; background:${r.color || '#888'};` : 'height:8px; width:100%;';
    const barClass = hasData ? 'vbar-bar' : 'vbar-bar vbar-pending';
    const countText = hasData ? r.reqs : '-';
    const countColor = hasData ? (r.color || '#1a1a1a') : '#bbb';
    return `<div class="vbar-col">
      <span class="vbar-count" style="color:${countColor};">${countText}</span>
      <div class="vbar-bar-wrap"><div class="${barClass}" style="${barStyle}"></div></div>
      <span class="vbar-name" style="${hasData ? `color:${r.color}; font-weight:600;` : ''}">${r.name}</span>
    </div>`;
  }).join('');

  // Jobs Actively Being Worked donut - aggregate statuses across all recruiters
  const statusAgg = {};
  recruiters.forEach(r => (r.statuses || []).forEach(st => {
    if (!statusAgg[st.label]) statusAgg[st.label] = { count: 0, color: st.color };
    statusAgg[st.label].count += st.count;
  }));
  const statusEntries = Object.entries(statusAgg).filter(([,v]) => v.count > 0);
  const statusTotal = statusEntries.reduce((a,[,v]) => a + v.count, 0);

  html += `
  <div class="row row-2-1">
    <div class="card">
      <div class="card-title">Recruiter Load — Open Reqs</div>
      <div class="vbar-wrap">${vbarCols}</div>
      <p class="pending-note">Updated ${fmtDate(data.lastUpdated)}</p>
    </div>
    <div class="card" style="display:flex;flex-direction:column;align-items:center;">
      <div class="card-title" style="width:100%;">Jobs Actively Being Worked</div>
      ${statusTotal > 0 ? `
      <div class="donut-wrap"><canvas id="donutWorked"></canvas><div class="donut-center"><div class="donut-center-num">${statusTotal}</div><div class="donut-center-lbl">Total</div></div></div>
      <div class="legend">${legendHTML(statusEntries.map(([label,v]) => ({label, count:v.count, color:v.color})))}</div>
      ` : `<div class="donut-pending"><div class="donut-pending-text">No status<br>data yet</div></div>`}
    </div>
  </div>`;

  // Campus donut
  const campusItems = (data.campus || []).filter(c => c.count > 0);
  const campusTotal = campusItems.reduce((a,c) => a + c.count, 0);

  // Req Type donut
  const reqTypeItems = (data.reqType || []).filter(r => r.count > 0);
  const reqTypeTotal = reqTypeItems.reduce((a,r) => a + r.count, 0);

  // Department/College donut
  const deptItems = (data.department || []).filter(d => d.count > 0);
  const deptTotal = deptItems.reduce((a,d) => a + d.count, 0);

  html += `<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;">
    <!-- Left column: Campus + Req Type stacked -->
    <div style="display:flex; flex-direction:column; gap:12px;">
      <div class="card" style="flex:0;">
        <div class="card-title">Jobs by Campus</div>
        ${campusTotal > 0 ? `
        <div style="display:flex; flex-wrap:wrap; gap:6px 16px;">
          ${campusItems.map(c => `<div style="font-size:12px; color:#555;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color};margin-right:6px;"></span>${c.label} ${Math.round((c.count / campusTotal) * 100)}%</div>`).join('')}
        </div>
        ` : `<p class="pending-note">No campus data yet</p>`}
      </div>
      <div class="card" style="display:flex;flex-direction:column;align-items:center;flex:1;">
        <div class="card-title" style="width:100%;">Reqs by Service Level</div>
        ${reqTypeTotal > 0 ? `
        <div class="donut-wrap"><canvas id="donutReqType"></canvas><div class="donut-center"><div class="donut-center-num">${reqTypeTotal}</div><div class="donut-center-lbl">Active</div></div></div>
        <div class="legend">${legendHTML(reqTypeItems)}</div>
        <div style="margin-top:10px; border-top:0.5px solid var(--border); padding-top:8px;">
          <div style="font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); margin-bottom:6px;">Service Level Definitions</div>
          <div style="font-size:10px; color:var(--text-secondary); margin-bottom:5px;"><strong>Passive</strong> — Basic support: posting, applicant disposition as they apply, offer assistance, and job offer processing. Also used for disposition or pipeline-building for a potential future need.</div>
          <div style="font-size:10px; color:var(--text-secondary); margin-bottom:5px;"><strong>Active</strong> — Premier support: includes Passive support plus candidate outreach, summaries, screening, interview scheduling, negotiation assistance, and onboarding follow-up.</div>
          <div style="font-size:10px; color:var(--text-secondary); margin-bottom:5px;"><strong>Evergreen</strong> — Ongoing/open-ended posting or talent pool for recurring hiring needs.</div>
          <div style="font-size:10px; color:var(--text-secondary); margin-bottom:5px;"><strong>Faculty</strong> — Academic faculty searches following faculty hiring process.</div>
          <div style="font-size:10px; color:var(--text-secondary);"><strong>Student</strong> — Student employment and OPS positions.</div>
        </div>
        ` : `<div class="donut-pending"><div class="donut-pending-text">No Service Level<br>data yet</div></div>
        <p class="pending-note" style="text-align:center;">Req Type field not set on records in Notion</p>`}
      </div>
    </div>
    <!-- Right column: Aging Heatmap full height -->
    <div class="card" style="display:flex; flex-direction:column;">
      <div class="card-title">Job Aging Heatmap</div>
      <p style="font-size:10px;color:#bbb;font-style:italic;margin-bottom:10px;">Click any band to drill into stalled reqs and highlight departments</p>
      ${(() => { currentAgingRecords = data.agingRecords || null; return renderAgingHeatmap(data.mainAging || [], data.agingRecords || null, 'main'); })()}
    </div>
  </div>`;

  // Pipeline funnel - ordered by pipeline sequence, not count
  const funnelOrder = ['Sourced','Recruiter Review','Screened','HM Review','Interview Stage','Offer Stage','Pre-boarding','Student Hiring','Faculty','Targeted','Backlog'];
  const funnelRaw = data.mainFunnel || [];
  const funnelMap2 = {};
  funnelRaw.forEach(f => { funnelMap2[f.label] = f.count; });

  // Build ordered funnel — pipeline stages first in sequence, then any remaining
  const funnelOrdered = [
    ...funnelOrder.filter(s => funnelMap2[s] > 0).map(s => ({ label: s, count: funnelMap2[s] })),
    ...funnelRaw.filter(f => !funnelOrder.includes(f.label) && f.count > 0)
  ];

  const maxFunnel = Math.max(...funnelOrdered.map(f => f.count), 1);
  const funnelColors = ['#006747','#00A693','#1B6A9C','#5B8FA8','#CFC483','#534AB7','#d4880a','#0F6E56','#993556','#7A9EB5','#888780'];
  let funnelHTML = '';
  funnelOrdered.forEach((f, i) => {
    const widthPct = Math.max(15, Math.round((f.count / maxFunnel) * 100));
    const indent = i * 5;
    const color = funnelColors[i % funnelColors.length];
    const textColor = color === '#CFC483' ? '#004d35' : '#fff';
    funnelHTML += `<div class="funnel-step"><div class="funnel-bar" style="width:${widthPct}%; margin-left:${indent}%; background:${color};"><span class="funnel-bar-label" style="color:${textColor};">${f.label}</span><span class="funnel-bar-count" style="color:${textColor};">${f.count}</span></div></div>`;
  });

  html += `<div class="row">
    <div class="card">
      <div class="card-title">Pipeline Funnel</div>
      ${funnelHTML}
    </div>
  </div>`;

  // Avg Time in Stage horizontal bar chart
  const stageMetrics = data.stageMetrics || [];
  if (stageMetrics.length > 0) {
    const maxDays = Math.max(...stageMetrics.map(s => s.avgDays), 1);
    const stageBars = stageMetrics.map(s => {
      const widthPct = Math.max(8, Math.round((s.avgDays / maxDays) * 100));
      return `<div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
        <span style="font-size:11px; color:#555; width:160px; flex-shrink:0; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${s.label}</span>
        <div style="flex:1; background:#f0efeb; border-radius:4px; height:24px;">
          <div style="width:${widthPct}%; background:${s.color}; border-radius:4px; height:24px; display:flex; align-items:center; padding-left:8px; min-width:40px;">
            <span style="font-size:11px; font-weight:700; color:#fff;">${s.avgDays}d</span>
          </div>
        </div>
        <span style="font-size:10px; color:#aaa; width:60px; flex-shrink:0; white-space:nowrap;">${s.count} reqs</span>
      </div>`;
    }).join('');
    html += `<div class="row">
      <div class="card">
        <div class="card-title">Avg. Time in Stage (days)</div>
        ${stageBars}
      </div>
    </div>`;
  }

  document.getElementById('page-main').innerHTML = html;

  if (statusTotal > 0) {
    buildDonut('donutWorked', statusEntries.map(([l])=>l), statusEntries.map(([,v])=>v.count), statusEntries.map(([,v])=>v.color));
  }
  if (reqTypeTotal > 0) {
    buildDonut('donutReqType', reqTypeItems.map(r=>r.label), reqTypeItems.map(r=>r.count), reqTypeItems.map(r=>r.color));
  }
}

function renderInsightsPage(data) {
  // Stage Conversion Rates — relocated from Main (live, based on current stage counts)
  const funnelMap = {};
  (data.mainFunnel || []).forEach(f => { funnelMap[f.label] = f.count; });
  const hired = data.summary?.filledYTD || 0;
  const totalReqs = data.summary?.openReqs || 0;

  const conversionStages = [
    { from: 'Sourced',         to: 'Screened',        fromKey: 'Sourced',         toKey: 'Screened',        color: '#006747' },
    { from: 'Screened',        to: 'HM Review',        fromKey: 'Screened',        toKey: 'HM Review',       color: '#00A693' },
    { from: 'HM Review',       to: 'Interview',        fromKey: 'HM Review',       toKey: 'Interview Stage', color: '#1B6A9C' },
    { from: 'Interview',       to: 'Offer',            fromKey: 'Interview Stage', toKey: 'Offer Stage',     color: '#534AB7' },
    { from: 'Offer',           to: 'Hired',            fromKey: 'Offer Stage',     toKey: null,              color: '#CFC483', toCount: hired }
  ];

  const conversionRows = conversionStages.map(s => {
    const fromCount = funnelMap[s.fromKey] || 0;
    const toCount = s.toCount !== undefined ? s.toCount : (funnelMap[s.toKey] || 0);
    if (fromCount === 0) {
      return `<div style="margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <span style="font-size:12px; color:#555;">${s.from} <span style="color:#aaa;">→</span> ${s.to}</span>
          <span style="font-size:12px; font-weight:600; color:#ccc;">N/A</span>
        </div>
        <div style="background:#f0efeb; border-radius:4px; height:10px;"></div>
        <div style="font-size:10px; color:#ccc; margin-top:2px; font-style:italic;">No reqs currently in ${s.from}</div>
      </div>`;
    }
    const pct = Math.min(100, Math.round((toCount / fromCount) * 100));
    const barColor = pct >= 60 ? '#006747' : pct >= 30 ? '#d4880a' : '#c0392b';
    return `<div style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <span style="font-size:12px; color:#555;">${s.from} <span style="color:#aaa;">→</span> ${s.to}</span>
        <span style="font-size:13px; font-weight:700; color:${barColor};">${pct}%</span>
      </div>
      <div style="background:#f0efeb; border-radius:4px; height:10px;">
        <div style="width:${pct}%; background:${s.color}; border-radius:4px; height:10px; transition:width .4s;"></div>
      </div>
      <div style="font-size:10px; color:#aaa; margin-top:2px;">${toCount} of ${fromCount} reqs</div>
    </div>`;
  }).join('');

  const overallPct = totalReqs > 0 ? Math.round((hired / totalReqs) * 100) : 0;

  const placeholderCard = (title, desc, status, statusColor) => `
    <div class="card">
      <div class="card-title">${title}</div>
      <p style="font-size:11px; color:#888; margin-bottom:14px; line-height:1.4;">${desc}</p>
      <div style="font-size:10px; font-weight:700; color:${statusColor}; text-transform:uppercase; letter-spacing:0.04em;">&#9679; ${status}</div>
    </div>`;

  const emptyNote = text => `<p class="pending-note">${text}</p>`;

  // Generic horizontal bar list — reused for TTF-by-X and Top Hiring Departments.
  // Trailing "N reqs" label is skipped when it would just repeat the bar's own value.
  const barListHTML = (items, labelKey, valueKey, unit, colorFn) => {
    if (!items.length) return emptyNote('No data yet');
    const maxVal = Math.max(...items.map(i => i[valueKey]), 1);
    return items.map(i => {
      const widthPct = Math.max(8, Math.round((i[valueKey] / maxVal) * 100));
      const color = colorFn(i);
      const showTrailingCount = valueKey !== 'count' && i.count !== undefined;
      return `<div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
        <span style="font-size:11px; color:#555; width:110px; flex-shrink:0; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${i[labelKey]}">${i[labelKey]}</span>
        <div style="flex:1; background:#f0efeb; border-radius:4px; height:22px;">
          <div style="width:${widthPct}%; background:${color}; border-radius:4px; height:22px; display:flex; align-items:center; padding-left:8px; min-width:36px;">
            <span style="font-size:11px; font-weight:700; color:#fff;">${i[valueKey]}${unit}</span>
          </div>
        </div>
        ${showTrailingCount ? `<span style="font-size:10px; color:#aaa; width:52px; flex-shrink:0; white-space:nowrap;">${i.count} reqs</span>` : `<span style="width:52px; flex-shrink:0;"></span>`}
      </div>`;
    }).join('');
  };

  // Fill Rate by Department — cancellations shown as a separate note, not blended into the rate
  const fillRateHTML = (() => {
    const items = data.insights?.fillRateByDept || [];
    if (!items.length) return emptyNote('No closed reqs yet');
    return items.slice(0, 8).map(d => {
      const pct = d.fillRatePct;
      const barColor = pct === null ? '#ccc' : pct >= 70 ? '#006747' : pct >= 40 ? '#d4880a' : '#c0392b';

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:3px;">
          <span style="font-size:11px; color:#555; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:200px;" title="${d.department}">${d.department}</span>
          <span style="font-size:12px; font-weight:700; color:${barColor};">${pct === null ? 'N/A' : pct + '%'}</span>
        </div>
        <div style="background:#f0efeb; border-radius:4px; height:8px;">
          <div style="width:${pct || 0}%; background:${barColor}; border-radius:4px; height:8px;"></div>
        </div>
        <div style="font-size:9px; color:#aaa; margin-top:2px;">${d.filled} filled, ${d.failed} failed${d.cancelled ? `, ${d.cancelled} cancelled (excluded from rate)` : ''}</div>
      </div>`;
    }).join('');
  })();

  // Stall Rate by Recruiter
  const stallRateHTML = (() => {
    const items = data.insights?.stallRateByRecruiter || [];
    if (!items.length) return emptyNote('No recruiter data yet');
    return items.map(r => {
      const barColor = r.stallRatePct >= 50 ? '#c0392b' : r.stallRatePct >= 25 ? '#d4880a' : '#006747';
      return `<div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
        <span style="font-size:11px; color:${r.color || '#555'}; font-weight:600; width:70px; flex-shrink:0; text-align:right;">${r.recruiter}</span>
        <div style="flex:1; background:#f0efeb; border-radius:4px; height:22px;">
          <div style="width:${Math.max(6, r.stallRatePct)}%; background:${barColor}; border-radius:4px; height:22px; display:flex; align-items:center; padding-left:8px; min-width:32px;">
            <span style="font-size:11px; font-weight:700; color:#fff;">${r.stallRatePct}%</span>
          </div>
        </div>
        <span style="font-size:10px; color:#aaa; width:78px; flex-shrink:0; white-space:nowrap;">${r.stalled} of ${r.totalActive}</span>
      </div>`;
    }).join('');
  })();

  const ttfByReqType = (data.insights?.avgTTFByReqType || []).map(i => ({ label: i.reqType, avgDays: i.avgDays, count: i.count }));
  const ttfByCampus = (data.insights?.avgTTFByCampus || []).map(i => ({ label: i.campus, avgDays: i.avgDays, count: i.count }));
  const topDepts = (data.insights?.topHiringDepartments || []).slice(0, 8).map(i => ({ label: i.department, count: i.count, val: i.count }));

  let html = `
  <p style="font-size:11px;color:#bbb;font-style:italic;margin-bottom:14px;">Internal Market Intelligence — built on our own recruiting data</p>

  <!-- Row 1: Fill & Conversion Performance -->
  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:12px;">
    <div class="card">
      <div class="card-title">Fill Rate by Department</div>
      <p style="font-size:10px; color:#bbb; font-style:italic; margin-bottom:12px;">Hired ÷ (Hired + Failed). Cancellations tracked separately — not counted against the rate.</p>
      ${fillRateHTML}
    </div>
    <div class="card">
      <div class="card-title">Stage Conversion Rates</div>
      <p style="font-size:10px; color:#bbb; font-style:italic; margin-bottom:12px;">Proxy — based on current req counts per stage. N/A = no reqs currently at that stage.</p>
      ${conversionRows}
    </div>
    <div class="card">
      <div class="card-title">Avg TTF by Req Type</div>
      <p style="font-size:10px; color:#bbb; font-style:italic; margin-bottom:12px;">Hired/Complete reqs only.</p>
      ${barListHTML(ttfByReqType, 'label', 'avgDays', 'd', () => '#534AB7')}
    </div>
  </div>

  <!-- Row 2: Time & Location -->
  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:12px;">
    <div class="card">
      <div class="card-title">Avg TTF by Campus</div>
      <p style="font-size:10px; color:#bbb; font-style:italic; margin-bottom:12px;">Hired/Complete reqs only.</p>
      ${barListHTML(ttfByCampus, 'label', 'avgDays', 'd', () => '#1B6A9C')}
    </div>
    <div class="card">
      <div class="card-title">Top Hiring Departments</div>
      <p style="font-size:10px; color:#bbb; font-style:italic; margin-bottom:12px;">Total reqs opened, active + closed.</p>
      ${barListHTML(topDepts, 'label', 'count', '', () => '#00A693')}
    </div>
    <div class="card">
      <div class="card-title">Stall Rate by Recruiter</div>
      <p style="font-size:10px; color:#bbb; font-style:italic; margin-bottom:12px;">% of each recruiter's active reqs in the 🔴 6+ day aging band.</p>
      ${stallRateHTML}
    </div>
  </div>

  <!-- Row 3: Trends (isolated — blocked on data quality) -->
  <div class="row">
    ${placeholderCard('Seasonal Hiring Trends', 'When does USF hiring spike? Monthly req opens and fills to identify peak seasons and plan ahead.', 'Needs date fields', '#BA7517')}
  </div>`;

  return html;
}

function renderAgingHeatmap(aging, agingRecords, contextKey) {
  if (!aging.length || aging.every(a => a.count === 0)) {
    return `<p class="pending-note">No aging data available yet</p>`;
  }
  if (agingRecords && contextKey) {
    agingRegistry[contextKey] = agingRecords;
  }
  let rows = aging.map((a) => {
    const hasRecords = a.count > 0 && agingRecords && contextKey;
    const safeLabel = a.label.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    const clickAttr = hasRecords ? `onclick="openDrillDown('${safeLabel}', '${contextKey}')"` : '';
    const rowClass = hasRecords ? 'heat-row-clickable' : '';
    const hint = hasRecords ? `<span style="font-size:9px;color:#aaa;margin-left:4px;">click to view</span>` : '';
    return `<tr class="${rowClass}" ${clickAttr}>
      <td>${a.label}${hint}</td>
      <td style="text-align:center;"><span class="${a.count > 0 ? 'heat-high' : 'heat-none'}">${a.count || '-'}</span></td>
    </tr>`;
  }).join('');
  return `<table class="heat-table"><thead><tr><th>Band</th><th style="text-align:center;">Count</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// Registry keyed by context (main vs per-recruiter) so drill-down always
// shows the right recruiter's reqs, not the last-rendered global set
const agingRegistry = {};
let currentAgingRecords = null; // kept for backward compat

function openDrillDown(bandLabel, contextKey) {
  const agingRecords = agingRegistry[contextKey] || currentAgingRecords;
  if (!agingRecords) return;
  const bandData = agingRecords.find(b => b.band === bandLabel ||
    b.band.replace(/–/g,'-') === bandLabel.replace(/–/g,'-'));
  if (!bandData) return;

  drillAllRecords = bandData.records || [];
  const panel = document.getElementById('drillPanel');
  const overlay = document.getElementById('drillOverlay');

  document.getElementById('drillTitle').textContent = bandLabel + ' — Aging Reqs';
  document.getElementById('drillSubtitle').textContent = drillAllRecords.length + ' requisition' + (drillAllRecords.length !== 1 ? 's' : '') + ' in this band';
  document.getElementById('drillSearch').value = '';
  document.getElementById('drillBody').innerHTML = buildDrillTable(drillAllRecords);
  panel.classList.add('open');
  overlay.classList.add('open');

  // Highlight departments in the bar chart that have reqs in this aging band
  highlightDeptBars(drillAllRecords);
}

function highlightDeptBars(records) {
  // Build a count map of departments in this aging band
  const deptCounts = {};
  records.forEach(r => {
    if (r.department) deptCounts[r.department] = (deptCounts[r.department] || 0) + 1;
  });

  // Find all dept bar rows and highlight/dim accordingly
  const barRows = document.querySelectorAll('.dept-bar-row');
  if (!barRows.length) return;

  barRows.forEach(row => {
    const dept = row.getAttribute('data-dept');
    const count = deptCounts[dept] || 0;
    const fill = row.querySelector('.dept-bar-fill');
    const badge = row.querySelector('.dept-aging-badge');

    if (count > 0) {
      row.style.opacity = '1';
      if (fill) fill.style.boxShadow = '0 0 0 2px #c0392b';
      // Add a red badge showing how many are stalled
      if (!badge) {
        const b = document.createElement('span');
        b.className = 'dept-aging-badge';
        b.style.cssText = 'font-size:10px;font-weight:700;color:#fff;background:#c0392b;border-radius:3px;padding:1px 5px;margin-left:4px;flex-shrink:0;';
        b.textContent = count + ' stalled';
        row.appendChild(b);
      } else {
        badge.textContent = count + ' stalled';
        badge.style.display = '';
      }
    } else {
      row.style.opacity = '0.25';
      if (fill) fill.style.boxShadow = 'none';
      if (badge) badge.style.display = 'none';
    }
  });

  // Show a reset hint above the chart
  const resetHint = document.getElementById('deptBarResetHint');
  if (resetHint) resetHint.style.display = 'block';
}

function clearDeptHighlight() {
  document.querySelectorAll('.dept-bar-row').forEach(row => {
    row.style.opacity = '1';
    const fill = row.querySelector('.dept-bar-fill');
    if (fill) fill.style.boxShadow = 'none';
    const badge = row.querySelector('.dept-aging-badge');
    if (badge) badge.style.display = 'none';
  });
  const resetHint = document.getElementById('deptBarResetHint');
  if (resetHint) resetHint.style.display = 'none';
}

function closeDrillDown() {
  document.getElementById('drillPanel').classList.remove('open');
  document.getElementById('drillOverlay').classList.remove('open');
  document.getElementById('drillSearch').value = '';
  clearDeptHighlight();
}

// Store all records for the current drill-down so filter can search them
let drillAllRecords = [];

function buildDrillTable(recs) {
  if (recs.length === 0) {
    return `<div class="drill-empty">No records match your filter.</div>`;
  }
  const rows = recs.map(r => `<tr>
    <td><strong>${r.title || 'Untitled'}</strong>${r.reqId ? `<br><span style="font-size:10px;color:#999;">#${r.reqId}</span>` : ''}</td>
    <td>${r.owner || '—'}</td>
    <td>${r.campus || '—'}</td>
    <td><span class="pill pill-blue">${r.stage || '—'}</span></td>
    <td>${r.department || '—'}</td>
    <td>${r.notionUrl ? `<a href="${r.notionUrl}" target="_blank" style="display:inline-block;font-size:10px;font-weight:600;padding:3px 8px;background:var(--usf-green);color:#fff;border-radius:4px;text-decoration:none;white-space:nowrap;">Open ↗</a>` : '—'}</td>
  </tr>`).join('');
  return `<div style="overflow-x:auto;"><table class="drill-table">
    <thead><tr><th>Requisition</th><th>Owner</th><th>Campus</th><th>Stage</th><th>Department</th><th>Action</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function filterClosedReqs() {
  const query = document.getElementById('closedSearch')?.value.toLowerCase().trim() || '';
  const buildRows = recs => recs.map(r => `<tr>
    <td><strong>${r.title || 'Untitled'}</strong>${r.reqId ? `<br><span style="font-size:10px;color:#999;">#${r.reqId}</span>` : ''}</td>
    <td>${r.owner || '—'}</td>
    <td>${r.campus || '—'}</td>
    <td>${r.department || '—'}</td>
    <td>${r.ttf > 0 ? r.ttf + 'd' : '—'}</td>
    <td>${r.notionUrl ? `<a href="${r.notionUrl}" target="_blank" style="display:inline-block;font-size:10px;font-weight:600;padding:3px 8px;background:var(--usf-green);color:#fff;border-radius:4px;text-decoration:none;">Open ↗</a>` : '—'}</td>
  </tr>`).join('');

  const match = r => !query ||
    (r.title||'').toLowerCase().includes(query) ||
    (r.owner||'').toLowerCase().includes(query) ||
    (r.campus||'').toLowerCase().includes(query) ||
    (r.department||'').toLowerCase().includes(query) ||
    (r.reqId||'').toString().includes(query);

  const filteredFilled = (window._closedFilled || []).filter(match);
  const filteredCanceled = (window._closedCanceled || []).filter(match);

  const filledEl = document.getElementById('filledTable');
  const canceledEl = document.getElementById('canceledTable');
  const filledCount = document.getElementById('filledCount');
  const canceledCount = document.getElementById('canceledCount');

  if (filledEl) filledEl.innerHTML = filteredFilled.length > 0
    ? `<div style="overflow-x:auto;"><table class="req-table"><thead><tr><th>Requisition</th><th>Owner</th><th>Campus</th><th>Department</th><th>TTF</th><th>Action</th></tr></thead><tbody>${buildRows(filteredFilled)}</tbody></table></div>`
    : `<p class="pending-note">No filled reqs match your filter.</p>`;
  if (canceledEl) canceledEl.innerHTML = filteredCanceled.length > 0
    ? `<div style="overflow-x:auto;"><table class="req-table"><thead><tr><th>Requisition</th><th>Owner</th><th>Campus</th><th>Department</th><th>TTF</th><th>Action</th></tr></thead><tbody>${buildRows(filteredCanceled)}</tbody></table></div>`
    : `<p class="pending-note">No cancelled reqs match your filter.</p>`;
  if (filledCount) filledCount.textContent = filteredFilled.length;
  if (canceledCount) canceledCount.textContent = filteredCanceled.length;
}

function filterDrillDown() {
  const query = document.getElementById('drillSearch').value.toLowerCase().trim();
  const filtered = query
    ? drillAllRecords.filter(r =>
        (r.title || '').toLowerCase().includes(query) ||
        (r.owner || '').toLowerCase().includes(query) ||
        (r.campus || '').toLowerCase().includes(query) ||
        (r.department || '').toLowerCase().includes(query) ||
        (r.stage || '').toLowerCase().includes(query) ||
        (r.reqId || '').toString().includes(query)
      )
    : drillAllRecords;
  document.getElementById('drillSubtitle').textContent =
    query ? `${filtered.length} of ${drillAllRecords.length} reqs` : `${drillAllRecords.length} requisition${drillAllRecords.length !== 1 ? 's' : ''} in this band`;
  document.getElementById('drillBody').innerHTML = buildDrillTable(filtered);
}

function renderRecruiterPage(r) {
  const hasData = (r.reqs || 0) > 0;
  const trackerUrls = {"katherine": "https://www.notion.so/486fbaa94c784fa09e1cd43c5dddaba2?v=800d477496014eab9e32442a3545f120", "rebecca": "https://www.notion.so/43a4a79f196240b8aac25ca27dcfa7d1?v=ae2fd6f1acaa4e1ca789ac97167f43d2", "john": "https://www.notion.so/2a2ea2b1077d429e975c4682a3a724e8?v=7b9c3c39a8bb4388857065258459c1cb", "gabriel": "https://app.notion.com/p/20b8fb48a95849568ba6a6013526b2d7?v=b74f0fc7660c45fe8da4e2ff65e90ea1", "tameka": "https://app.notion.com/p/8762e3f9f33f4c238273211c4390935c?v=dbca9b41c64b4a11bd55973e9d0ce82a"};
  const trackerUrl = trackerUrls[r.id] || null;

  let html = `<div class="detail-header">
    <div class="detail-avatar" style="background:${r.bgLight || '#eee'}; color:${r.color || '#333'};">${r.initials || '??'}</div>
    <div>
      <div class="detail-name">${r.name}</div>
      <div class="detail-sub">${r.campus || ''}</div>
    </div>
    ${trackerUrl ? `<a href="${trackerUrl}" target="_blank" style="margin-left:auto; display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:8px 14px; background:var(--usf-green); color:#fff; border-radius:6px; text-decoration:none; flex-shrink:0;">
      <span>Open My Tracker</span><span style="font-size:14px;">↗</span>
    </a>` : ''}
  </div>`;

  if (!hasData) {
    html += `<div class="card" style="text-align:center; padding:48px;">
      <div style="font-size:14px; color:#999; margin-bottom:8px;">No data yet</div>
      <div style="font-size:12px; color:#bbb;">${r.name}'s requisitions will appear here once their data is synced from Notion.</div>
    </div>`;
    return html;
  }

  html += `<div class="kpi-row">
    <div class="kpi"><div class="kpi-label">Total Reqs</div><div class="kpi-val">${r.reqs}</div><div class="kpi-sub">all assigned</div></div>
    <div class="kpi"><div class="kpi-label">WIP ✅</div><div class="kpi-val kpi-val-blue">${r.wip || 0}</div><div class="kpi-sub">actively worked</div></div>
    <div class="kpi"><div class="kpi-label">Filled</div><div class="kpi-val kpi-val-green">${r.filled || 0}</div><div class="kpi-sub">hired</div></div>
    <div class="kpi"><div class="kpi-label">Failed</div><div class="kpi-val kpi-val-red">${r.failed || 0}</div><div class="kpi-sub">canceled/no hire</div></div>
    <div class="kpi"><div class="kpi-label">Avg Time to Fill</div><div class="kpi-val kpi-val-amber">${r.ttf || 0}d</div><div class="kpi-sub">days</div></div>
  </div>`;

  const statuses = r.statuses || [];
  if (statuses.length) {
    const maxS = Math.max(...statuses.map(s=>s.count), 1);
    let statusHTML = '';
    statuses.forEach((s,i) => {
      const widthPct = Math.max(20, Math.round((s.count / maxS) * 100));
      const indent = i * 4.5;
      const textColor = '#fff';
      statusHTML += `<div class="funnel-step"><div class="funnel-bar" style="width:${widthPct}%; margin-left:${indent}%; background:${s.color};"><span class="funnel-bar-label" style="color:${textColor};">${s.label}</span><span class="funnel-bar-count" style="color:${textColor};">${s.count}</span></div></div>`;
    });
    html += `<div class="card"><div class="card-title">Pipeline by Status</div>${statusHTML}</div>`;
  }

  // Per-recruiter aging heatmap + avg time in stage — side by side
  const hasAging = r.agingRecords && r.agingRecords.some(b => b.records.length > 0);
  const hasStage = r.stageMetrics && r.stageMetrics.length > 0;

  if (hasAging || hasStage) {
    html += `<div style="display:grid;grid-template-columns:1fr 1.6fr;gap:12px;margin-top:10px;">`;

    if (hasAging) {
      const recAging = r.agingRecords.map(b => ({ label: b.band, count: b.records.length, color: b.color }));
      currentAgingRecords = r.agingRecords;
      html += `<div class="card" style="display:flex;flex-direction:column;">
        <div class="card-title">Job Aging Heatmap</div>
        <p style="font-size:10px;color:#bbb;font-style:italic;margin-bottom:8px;">Click any band to see your stalled reqs</p>
        ${renderAgingHeatmap(recAging, r.agingRecords, r.id)}
      </div>`;
    }

    if (hasStage) {
      const maxDays = Math.max(...r.stageMetrics.map(s => s.avgDays), 1);
      const stageBars = r.stageMetrics.map(s => {
        const widthPct = Math.max(8, Math.round((s.avgDays / maxDays) * 100));
        return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;">
          <span style="font-size:11px;color:#555;width:130px;flex-shrink:0;text-align:right;">${s.label}</span>
          <div style="flex:1;background:#f0efeb;border-radius:4px;height:22px;">
            <div style="width:${widthPct}%;background:${s.color};border-radius:4px;height:22px;display:flex;align-items:center;padding-left:8px;min-width:36px;">
              <span style="font-size:11px;font-weight:700;color:#fff;">${s.avgDays}d</span>
            </div>
          </div>
          <span style="font-size:10px;color:#aaa;width:44px;flex-shrink:0;">${s.count} reqs</span>
        </div>`;
      }).join('');
      html += `<div class="card" style="display:flex;flex-direction:column;">
        <div class="card-title">Avg. Time in Stage (days)</div>
        ${stageBars}
      </div>`;
    }

    html += `</div>`;
  }

  // Per-recruiter conversion rates
  const recFunnelMap = {};
  (r.statuses || []).forEach(s => { recFunnelMap[s.label] = s.count; });
  const recHired = r.filled || 0;
  const recTotal = r.reqs || 0;

  const recConvStages = [
    { from: 'Sourced',   to: 'Screened',   fromKey: 'Sourced',         toKey: 'Screened',        color: '#006747' },
    { from: 'Screened',  to: 'HM Review',  fromKey: 'Screened',        toKey: 'HM Review',       color: '#00A693' },
    { from: 'HM Review', to: 'Interview',  fromKey: 'HM Review',       toKey: 'Interview Stage', color: '#1B6A9C' },
    { from: 'Interview', to: 'Offer',      fromKey: 'Interview Stage', toKey: 'Offer Stage',     color: '#534AB7' },
    { from: 'Offer',     to: 'Hired',      fromKey: 'Offer Stage',     toKey: null,              color: '#CFC483', toCount: recHired }
  ];

  const hasConvData = recConvStages.some(s => (recFunnelMap[s.fromKey] || 0) > 0);
  if (hasConvData) {
    const recConvRows = recConvStages.map(s => {
      const fromCount = recFunnelMap[s.fromKey] || 0;
      const toCount = s.toCount !== undefined ? s.toCount : (recFunnelMap[s.toKey] || 0);
      if (fromCount === 0) return '';
      const pct = Math.min(100, Math.round((toCount / fromCount) * 100));
      const barColor = pct >= 60 ? '#006747' : pct >= 30 ? '#d4880a' : '#c0392b';
      return `<div style="margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <span style="font-size:12px; color:#555;">${s.from} <span style="color:#aaa;">→</span> ${s.to}</span>
          <span style="font-size:13px; font-weight:700; color:${barColor};">${pct}%</span>
        </div>
        <div style="background:#f0efeb; border-radius:4px; height:10px;">
          <div style="width:${pct}%; background:${s.color}; border-radius:4px; height:10px;"></div>
        </div>
        <div style="font-size:10px; color:#aaa; margin-top:2px;">${toCount} of ${fromCount} reqs</div>
      </div>`;
    }).filter(Boolean).join('');

    const recOverallPct = recTotal > 0 ? Math.round((recHired / recTotal) * 100) : 0;
    html += `<div class="row row-half" style="margin-top:10px;">
      <div class="card">
        <div class="card-title">Stage Conversion Rates</div>
        <p style="font-size:10px; color:#bbb; font-style:italic; margin-bottom:12px;">Proxy — based on current req counts per stage</p>
        ${recConvRows}
      </div>
      <div class="card" style="display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
        <div class="card-title" style="width:100%;">Overall Conversion</div>
        <div style="font-size:56px; font-weight:700; color:${recOverallPct >= 20 ? '#006747' : recOverallPct >= 10 ? '#d4880a' : '#c0392b'}; line-height:1; margin:16px 0 8px;">${recOverallPct}%</div>
        <div style="font-size:12px; color:#888;">${recHired} hired of ${recTotal} reqs</div>
        <div style="font-size:10px; color:#bbb; margin-top:8px; font-style:italic;">Filled ÷ Total Reqs</div>
      </div>
    </div>`;
  }

  return html;
}

    tab.className = 'nav-tab';
    tab.setAttribute('data-page', r.id);

function filterQualityByOwner() {
  const owner = document.getElementById('qualityOwnerFilter')?.value || 'All Owners';
  const dq = window._dataQuality || [];
  const sections = document.getElementById('qualityDetailSections');
  if (!sections) return;

  const buildRows = (f) => {
    const filtered = owner === 'All Owners' ? f.records : f.records.filter(r => r.owner === owner);
    if (filtered.length === 0) return '';
    const rows = filtered.map(r => `<tr>
      <td><strong>${r.title || 'Untitled'}</strong>${r.reqId ? `<br><span style="font-size:10px;color:#999;">#${r.reqId}</span>` : ''}</td>
      <td>${r.owner || '—'}</td>
      <td>${r.campus || '—'}</td>
      <td>${r.stage || '—'}</td>
      <td>${r.notionUrl ? `<a href="${r.notionUrl}" target="_blank" style="display:inline-block;font-size:10px;font-weight:600;padding:3px 8px;background:var(--usf-green);color:#fff;border-radius:4px;text-decoration:none;">Open ↗</a>` : '—'}</td>
    </tr>`).join('');
    return `<div class="card" style="margin-bottom:12px;">
      <div class="card-title" style="color:#c0392b;">🔴 Missing: ${f.field} — ${filtered.length} reqs</div>
      <div style="overflow-x:auto;"><table class="drill-table">
        <thead><tr><th>Requisition</th><th>Owner</th><th>Campus</th><th>Stage</th><th>Action</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  };

  const html = dq.filter(f => f.missingCount > 0).map(buildRows).filter(Boolean).join('');
  sections.innerHTML = html || `<div class="card" style="text-align:center;padding:30px;"><div style="font-size:14px;color:#006747;font-weight:700;">✅ No missing data for ${owner}</div></div>`;
}

function renderQualityPage(dataQuality) {
  if (!dataQuality || dataQuality.length === 0) {
    return `<div class="card"><p class="pending-note">No data quality info available yet — run a sync first.</p></div>`;
  }

  // Get unique owners across all missing records
  const allOwners = new Set();
  dataQuality.forEach(f => f.records.forEach(r => { if (r.owner) allOwners.add(r.owner); }));
  const ownerOptions = ['All Owners', ...Array.from(allOwners).sort()].map(o =>
    `<option value="${o}">${o}</option>`
  ).join('');

  // Summary cards
  const summaryCards = dataQuality.map(f => {
    const pctColor = f.pct === 0 ? '#006747' : f.pct < 20 ? '#d4880a' : '#c0392b';
    const status = f.pct === 0 ? '✅' : f.pct < 20 ? '⚠️' : '🔴';
    return `<div class="kpi" style="border-top:2px solid ${pctColor};">
      <div class="kpi-label">${f.field}</div>
      <div class="kpi-val" style="color:${pctColor}; font-size:22px;">${status} ${f.missingCount}</div>
      <div class="kpi-sub">${f.pct}% of active reqs missing</div>
    </div>`;
  }).join('');

  // Detail tables per field
  const buildDetailSections = (ownerFilter) => dataQuality
    .filter(f => f.missingCount > 0)
    .map(f => {
      const filtered = ownerFilter === 'All Owners'
        ? f.records
        : f.records.filter(r => r.owner === ownerFilter);
      if (filtered.length === 0) return '';

      const rows = filtered.map(r => `<tr>
        <td><strong>${r.title || 'Untitled'}</strong>${r.reqId ? `<br><span style="font-size:10px;color:#999;">#${r.reqId}</span>` : ''}</td>
        <td>${r.owner || '—'}</td>
        <td>${r.campus || '—'}</td>
        <td>${r.stage || '—'}</td>
        <td>${r.notionUrl ? `<a href="${r.notionUrl}" target="_blank" style="display:inline-block;font-size:10px;font-weight:600;padding:3px 8px;background:var(--usf-green);color:#fff;border-radius:4px;text-decoration:none;">Open ↗</a>` : '—'}</td>
      </tr>`).join('');

      const more = f.missingCount > 50 ? `<p style="font-size:10px;color:#aaa;font-style:italic;margin-top:6px;">Showing top 50 records — fix these first.</p>` : '';

      return `<div class="card" style="margin-bottom:12px;">
        <div class="card-title" style="color:#c0392b;">🔴 Missing: ${f.field} — ${filtered.length} reqs</div>
        <div style="overflow-x:auto;">
          <table class="drill-table">
            <thead><tr><th>Requisition</th><th>Owner</th><th>Campus</th><th>Stage</th><th>Action</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        ${more}
      </div>`;
    }).filter(Boolean).join('');

  const allClean = dataQuality.every(f => f.missingCount === 0);

  // Store dataQuality globally for filter use
  window._dataQuality = dataQuality;

  return `
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
      <div style="font-size:11px;color:#888;font-style:italic;">Based on ${dataQuality[0]?.totalActive || 0} active reqs. Click "Open ↗" to fix directly in Notion.</div>
      <div style="display:flex; align-items:center; gap:8px;">
        <label style="font-size:11px;color:#555;font-weight:600;">Filter by owner:</label>
        <select id="qualityOwnerFilter" onchange="filterQualityByOwner()" style="font-size:12px;padding:5px 10px;border:0.5px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text-primary);">
          ${ownerOptions}
        </select>
      </div>
    </div>
    <div class="kpi-row" style="margin-bottom:16px;">${summaryCards}</div>
    <div id="qualityDetailSections">
      ${allClean
        ? `<div class="card" style="text-align:center;padding:40px;">
            <div style="font-size:32px;margin-bottom:8px;">✅</div>
            <div style="font-size:16px;font-weight:700;color:#006747;">All fields complete</div>
            <div style="font-size:12px;color:#888;margin-top:4px;">No missing data detected across active reqs.</div>
          </div>`
        : buildDetailSections('All Owners')
      }
    </div>`;
}

function renderClosedPage(closedReqs) {
  const filled = closedReqs.filter(r => ['Hired','Filled','Complete'].includes(r.stage));
  const canceled = closedReqs.filter(r => ['Canceled','Failed Search'].includes(r.stage));
  const avgTTF = filled.length > 0
    ? Math.round(filled.filter(r => r.ttf > 0).reduce((a,r) => a + r.ttf, 0) / Math.max(filled.filter(r => r.ttf > 0).length, 1))
    : 0;

  // Store for filtering
  window._closedFilled = filled;
  window._closedCanceled = canceled;

  const buildTable = (recs, tableId, emptyMsg) => {
    if (recs.length === 0) return `<p class="pending-note">${emptyMsg}</p>`;
    const rows = recs.map(r => `<tr>
      <td><strong>${r.title || 'Untitled'}</strong>${r.reqId ? `<br><span style="font-size:10px;color:#999;">#${r.reqId}</span>` : ''}</td>
      <td>${r.owner || '—'}</td>
      <td>${r.campus || '—'}</td>
      <td>${r.department || '—'}</td>
      <td>${r.ttf > 0 ? r.ttf + 'd' : '—'}</td>
      <td>${r.notionUrl ? `<a href="${r.notionUrl}" target="_blank" style="display:inline-block;font-size:10px;font-weight:600;padding:3px 8px;background:var(--usf-green);color:#fff;border-radius:4px;text-decoration:none;">Open ↗</a>` : '—'}</td>
    </tr>`).join('');
    return `<div id="${tableId}" style="overflow-x:auto;"><table class="req-table">
      <thead><tr><th>Requisition</th><th>Owner</th><th>Campus</th><th>Department</th><th>TTF</th><th>Action</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  };

  return `
    <div class="kpi-row" style="margin-bottom:16px;">
      <div class="kpi"><div class="kpi-label">Filled YTD</div><div class="kpi-val kpi-val-green">${filled.length}</div><div class="kpi-sub">positions closed</div></div>
      <div class="kpi"><div class="kpi-label">Avg Time to Fill</div><div class="kpi-val">${avgTTF > 0 ? avgTTF + 'd' : '—'}</div><div class="kpi-sub">for filled reqs</div></div>
      <div class="kpi"><div class="kpi-label">Cancelled / Failed</div><div class="kpi-val kpi-val-red">${canceled.length}</div><div class="kpi-sub">searches no hire</div></div>
    </div>

    <div style="margin-bottom:12px;">
      <input type="text" id="closedSearch" placeholder="Filter by title, owner, campus, or department..." oninput="filterClosedReqs()" style="width:100%; font-size:12px; padding:8px 12px; border:0.5px solid var(--border); border-radius:6px; background:var(--surface); color:var(--text-primary); outline:none; box-sizing:border-box;">
    </div>

    <div class="card" style="margin-bottom:12px;">
      <div class="card-title" style="color:var(--usf-green);">✅ Filled / Hired (<span id="filledCount">${filled.length}</span>)</div>
      <div id="filledTable">${buildTable(filled, 'filledTableInner', 'No filled reqs yet — check back once searches close.')}</div>
    </div>

    <div class="card">
      <div class="card-title" style="color:#c0392b;">❌ Cancelled / Failed (<span id="canceledCount">${canceled.length}</span>)</div>
      <div id="canceledTable">${buildTable(canceled, 'canceledTableInner', 'No cancelled searches on record.')}</div>
    </div>`;
}

async function loadDashboard() {
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    DASHBOARD_DATA = data;

    document.getElementById('loadingMsg').remove();
    const mainPage = document.createElement('div');
    mainPage.className = 'page';
    mainPage.id = 'page-main';
    document.getElementById('content').appendChild(mainPage);

    buildNav(data.recruiters || []);
    buildPages(data.recruiters || []);
    renderMainPage(data);

    // Render insights page
    const insightsPage = document.getElementById('page-insights');
    if (insightsPage) insightsPage.innerHTML = renderInsightsPage(data);

    // Render data quality page
    const qualityPage = document.getElementById('page-quality');
    if (qualityPage) qualityPage.innerHTML = renderQualityPage(data.dataQuality || []);

    document.querySelector('.nav-tab[data-page="main"]').classList.add('active');
    document.getElementById('page-main').style.display = 'block';
    document.getElementById('syncBadge').textContent = 'Synced: ' + fmtDate(data.lastUpdated);
  } catch (err) {
    document.getElementById('content').innerHTML = `<div class="error-box">
      Couldn't load <code>data.json</code> (${err.message}). Make sure it sits next to <code>index.html</code>.
      On GitHub Pages this loads automatically; opening the file directly with <code>file://</code> blocks fetch —
      run a local server (<code>python3 -m http.server</code>) to preview.
    </div>`;
    document.getElementById('syncBadge').textContent = 'Sync error';
  }
}

loadDashboard();
</script>
</body>
</html>
