<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHR Recruiting Dashboard</title>
<style>
:root {
  --green: #006747;
  --green-dark: #004d35;
  --green-tint: #e8f2ed;
  --gold: #CFC483;
  --bg: #f4f4f1;
  --surface: #ffffff;
  --sunken: #f1f1ed;
  --border: #e3e3dd;
  --ink: #1c2220;
  --muted: #5b6461;
  --faint: #8b928f;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(20,30,25,.05);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }

/* Header */
.header { background: var(--green); color: #fff; }
.header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 92px; }
.header img { height: 74px; width: auto; display: block; }
.sync { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }

/* Nav */
.nav { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: block; padding: 14px 14px 12px; font-size: 14px; font-weight: 600; color: var(--muted); text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.active { color: var(--green); border-bottom-color: var(--green); }
.picker { display: none; border-top: 1px solid var(--border); background: #fafaf8; }
.picker.open { display: block; }
.picker .wrap { display: flex; align-items: center; gap: 8px; padding-top: 9px; padding-bottom: 9px; overflow-x: auto; scrollbar-width: none; }
.picker .wrap::-webkit-scrollbar { display: none; }
.picker-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-right: 2px; }
.pill { display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0; font-size: 13px; font-weight: 600; padding: 3px 12px 3px 3px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface); text-decoration: none; color: var(--ink); }
.pill:hover { border-color: var(--pc); }
.pill.active { background: var(--pc); border-color: var(--pc); color: #fff; }
.pill-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--pb); color: var(--pc); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.pill.active .pill-dot { background: rgba(255,255,255,.22); color: #fff; }

/* Page */
main { padding: 22px 0 40px; }
.page { display: none; }
.page.show { display: block; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.page-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.footnote { font-size: 12px; color: var(--faint); margin-top: 18px; max-width: 900px; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpis.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.kpi-label { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); }
.kpi-val { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi-val small { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 1px; }
.kpi-sub { font-size: 12px; color: var(--faint); margin-top: 2px; }
.kpi.lead { border-top: 3px solid var(--green); }

/* Tooltips (hover on desktop, tap on touch) */
.tip { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid #c9ccc8; color: var(--faint); font-size: 10px; font-weight: 700; font-style: normal; cursor: help; flex-shrink: 0; background: transparent; padding: 0; line-height: 1; }
.tip:focus { outline: 2px solid var(--green); outline-offset: 1px; }
.tip .tip-box { display: none; position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%); width: 240px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 400; line-height: 1.4; text-align: left; padding: 8px 10px; border-radius: 8px; z-index: 60; text-transform: none; letter-spacing: 0; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.tip:hover .tip-box, .tip:focus .tip-box { display: block; }

/* Cards & grid */
.grid { display: grid; gap: 14px; margin-bottom: 14px; }
.g-2-1 { grid-template-columns: 2fr 1fr; }
.g-1-1 { grid-template-columns: 1fr 1fr; }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-title { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; }
.card-meta { font-size: 12px; color: var(--faint); }
.card-note { font-size: 12px; color: var(--muted); margin: -6px 0 12px; }
.empty { font-size: 13px; color: var(--faint); padding: 10px 0; }

/* Horizontal bars */
.hb { display: grid; grid-template-columns: var(--lw, 140px) minmax(0, 1fr); align-items: center; gap: 10px; margin-bottom: 8px; }
.hb:last-child { margin-bottom: 0; }
.hb-label { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.hb-track { display: flex; align-items: center; gap: 8px; min-width: 0; height: 22px; }
.hb-fill { height: 100%; border-radius: 4px; min-width: 4px; }
.hb-val { font-size: 13px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.hb-val span { font-weight: 400; color: var(--faint); margin-left: 4px; }

/* Aging strip */
.strip { display: flex; height: 34px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--sunken); }
.strip button { border: 0; padding: 0; cursor: pointer; min-width: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; overflow: hidden; }
.strip button:hover { filter: brightness(1.12); }
.strip button:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
.tiers { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.tier { display: flex; align-items: center; gap: 9px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.tier:hover:not(:disabled) { border-color: var(--tc); background: var(--tb); }
.tier:disabled { cursor: default; opacity: .55; }
.tier-sw { width: 10px; height: 28px; border-radius: 3px; background: var(--tc); flex-shrink: 0; }
.tier-n { font-size: 20px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tier-l { font-size: 12px; color: var(--muted); }
.scope { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.scope b { color: var(--ink); }

/* Service level definitions */
details.defs { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
details.defs summary { font-size: 12px; font-weight: 600; color: var(--green); cursor: pointer; list-style: none; }
details.defs summary::-webkit-details-marker { display: none; }
details.defs summary::before { content: "+ "; }
details.defs[open] summary::before { content: "− "; }
.defs dl { margin-top: 8px; font-size: 12px; color: var(--muted); }
.defs dt { font-weight: 700; color: var(--ink); margin-top: 6px; }

/* Rate bars (fill rate) */
.conv { margin-bottom: 12px; }
.conv:last-child { margin-bottom: 0; }
.conv-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.conv-top b { color: var(--ink); font-variant-numeric: tabular-nums; }
.conv-bar { height: 8px; background: var(--sunken); border-radius: 4px; overflow: hidden; }
.conv-bar div { height: 100%; border-radius: 4px; }
.conv-sub { font-size: 11px; color: var(--faint); margin-top: 3px; }
.split { display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; }
.split .conv:last-child, .split .conv:nth-last-child(2) { margin-bottom: 0; }

/* Columns chart */
.cols { display: flex; align-items: flex-end; gap: 6px; height: 160px; overflow-x: auto; padding-bottom: 2px; }
.col { flex: 1 0 34px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.col-n { font-size: 11px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.col-bar { width: 100%; max-width: 30px; background: #00A693; border-radius: 3px 3px 0 0; }
.col-l { font-size: 10px; color: var(--faint); white-space: nowrap; }

/* Recruiter header */
.rhead { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.avatar { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; flex-shrink: 0; }
.rname { font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
.rsub { font-size: 13px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 8px; text-decoration: none; background: var(--green); color: #fff; border: 0; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--green-dark); }
.btn-sm { font-size: 12px; padding: 6px 10px; border-radius: 6px; }
.rhead .btn { margin-left: auto; }

/* Needs attention */
.attn-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.attn-count { font-size: 13px; color: var(--muted); }
.attn-count b { color: var(--ink); font-size: 15px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.filters input, .filters select { height: 36px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 0 10px; font-size: 13px; }
.filters input { flex: 1 1 220px; min-width: 0; }
.filters select { flex: 0 1 190px; min-width: 0; }
.filters input:focus, .filters select:focus { outline: 2px solid var(--green); outline-offset: -1px; border-color: transparent; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--green); color: #fff; }
.list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.row { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto auto auto; align-items: center; gap: 12px; padding: 10px 12px 10px 0; border-bottom: 1px solid var(--border); background: var(--surface); }
.row:last-child { border-bottom: 0; }
.row:hover { background: #fafaf8; }
.row-band { align-self: stretch; background: var(--tc); }
.row-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-meta { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip-dot { width: 8px; height: 8px; border-radius: 50%; }
.stage-chip { background: var(--sunken); color: var(--ink); }
.age-chip { background: var(--tb); color: var(--tc); }
.more { display: block; width: 100%; border: 0; background: #fafaf8; padding: 10px; font-size: 13px; font-weight: 600; color: var(--green); cursor: pointer; }
.state { text-align: center; padding: 28px 16px; color: var(--muted); font-size: 14px; }
.state b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

/* Drill-down sheet */
.scrim { display: none; position: fixed; inset: 0; background: rgba(15,20,18,.42); z-index: 90; }
.scrim.open { display: block; }
.sheet { position: fixed; top: 0; right: 0; height: 100%; width: 720px; max-width: 100%; background: var(--surface); z-index: 100; transform: translateX(105%); transition: transform .25s ease; display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.15); }
.sheet.open { transform: none; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 12px; border-bottom: 1px solid var(--border); }
.sheet-title { font-size: 17px; font-weight: 700; }
.sheet-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.x { width: 34px; height: 34px; border-radius: 8px; border: 0; background: var(--sunken); cursor: pointer; font-size: 16px; flex-shrink: 0; }
.x:hover { background: var(--border); }
.sheet-search { padding: 12px 20px; border-bottom: 1px solid var(--border); }
.sheet-search input { width: 100%; height: 36px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; font-size: 13px; }
.sheet-body { overflow-y: auto; flex: 1; }
.sheet-body .list { border: 0; border-radius: 0; }

.error-box { background: #fff7e0; border: 1px solid #f0d27a; border-radius: var(--radius); padding: 16px; font-size: 14px; color: #6b4e00; }
.error-box code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; }
.loading { text-align: center; padding: 70px 0; color: var(--faint); }

/* Responsive */
@media (max-width: 1000px) {
  .kpis, .kpis.six { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g-3 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  .header .wrap { min-height: 64px; }
  .header img { height: 46px; }
  .sync { font-size: 11px; padding: 4px 9px; }
  main { padding-top: 16px; }
  .kpis, .kpis.six { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { padding: 12px; }
  .kpi-val { font-size: 24px; }
  .g-2-1, .g-1-1, .g-3, .split { grid-template-columns: 1fr; }
  .split .conv:nth-last-child(2) { margin-bottom: 12px; }
  .tiers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hb { --lw: 110px !important; }
  .hb-label { font-size: 12px; }
  .row { grid-template-columns: 6px minmax(0, 1fr) auto; grid-template-areas: "b t o" "b s s"; row-gap: 6px; }
  .row-band { grid-area: b; }
  .row-main { grid-area: t; }
  .row-chips { grid-area: s; display: flex; gap: 6px; flex-wrap: wrap; }
  .row-open { grid-area: o; }
  .rhead .btn { margin-left: 0; width: 100%; justify-content: center; }
  .page-title { font-size: 19px; }
  .tip .tip-box { width: 200px; }
}
@media (min-width: 761px) { .row-chips { display: contents; } }

/* Print: the current page only, calm and on white */
@media print {
  @page { margin: 12mm; }
  body { background: #fff; font-size: 12px; }
  .nav, .scrim, .sheet, .filters, .seg, .more, .btn, .tip { display: none !important; }
  .header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .card, .kpi { box-shadow: none; break-inside: avoid; }
  .hb-fill, .strip button, .tier-sw, .row-band, .conv-bar div, .col-bar, .avatar, .chip-dot { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  details.defs > dl { display: block; }
  main { padding-top: 12px; }
}
</style>
</head>

<script>
'use strict';

// ---------------------------------------------------------------------------
// Fixed configuration
// ---------------------------------------------------------------------------
// Tracker links live here, not in data.json (same map as the current index.html).
// A recruiter with no entry gets no "Open My Tracker" button.
const TRACKER_URLS = {"katherine": "https://www.notion.so/486fbaa94c784fa09e1cd43c5dddaba2?v=800d477496014eab9e32442a3545f120", "rebecca": "https://www.notion.so/43a4a79f196240b8aac25ca27dcfa7d1?v=ae2fd6f1acaa4e1ca789ac97167f43d2", "john": "https://www.notion.so/2a2ea2b1077d429e975c4682a3a724e8?v=7b9c3c39a8bb4388857065258459c1cb", "gabriel": "https://app.notion.com/p/20b8fb48a95849568ba6a6013526b2d7?v=b74f0fc7660c45fe8da4e2ff65e90ea1", "tameka": "https://app.notion.com/p/8762e3f9f33f4c238273211c4390935c?v=dbca9b41c64b4a11bd55973e9d0ce82a", "aidi": "https://app.notion.com/p/f1809bfc270647a0ae9f4da6e76281fa?v=f65b7d5d06b141229481f5e86eaf6b10"};

// Sequential stages (the funnel) vs. service-type categories (shown as "Reqs by Type").
const FUNNEL_ORDER = ['Sourced', 'Recruiter Review', 'HM Review', 'Interview Stage', 'Offer Stage', 'Pre-boarding'];
const TYPE_CATEGORIES = ['Passive Hiring', 'Faculty Hiring', 'Student Hiring', 'Evergreen / Continuous Pool', 'Targeted Hiring', 'Backlog'];
const NEUTRAL = '#5B7A8A';
// Tiers that count as "needs attention" on recruiter pages (6+ days since last stage change).
const ATTENTION_MIN_DAYS = 6;

let DATA = null;
let RECRUITERS = [];
let lastRecruiterId = null;
const STAGE_COLOR = {};
const pageState = {};   // per-recruiter list filters

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => (typeof u === 'string' && /^https:\/\//i.test(u)) ? u : null;
const isNum = v => typeof v === 'number' && isFinite(v);
// Missing data shows "—", never 0.
const show = v => isNum(v) ? v.toLocaleString('en-US') : '—';
const days = v => isNum(v) && v > 0 ? `${v}<small>d</small>` : '—';
const daysText = v => isNum(v) && v > 0 ? `${v}d` : '—';
const bandLabel = b => String(b || '').replace(/[\u{1F534}\u{1F7E1}\u{1F7E2}]/gu, '').trim();
const tierName = b => bandLabel(b) + ' days';
const reqs = n => `${show(n)} req${n === 1 ? '' : 's'}`;

function fmtSync(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ', ' +
         d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function textOn(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return '#fff';
  const n = parseInt(m[1], 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? '#1c2220' : '#fff';
}

const stageColor = label => STAGE_COLOR[label] || '#888780';

function tip(text) {
  return `<button type="button" class="tip" aria-label="${esc(text)}">i<span class="tip-box" role="tooltip">${esc(text)}</span></button>`;
}

function card(title, body, opts = {}) {
  return `<section class="card"${opts.id ? ` id="${opts.id}"` : ''}>
    <div class="card-head"><h2 class="card-title">${esc(title)}${opts.tip ? tip(opts.tip) : ''}</h2>${opts.meta ? `<span class="card-meta">${opts.meta}</span>` : ''}</div>
    ${opts.note ? `<p class="card-note">${opts.note}</p>` : ''}
    ${body}
  </section>`;
}

// One horizontal-bar renderer for every bar list, so they can't drift apart.
// The fill is capped at 82% of the track so the value always fits beside it.
function hbars(items, { labelWidth = 140, value = i => i.count, format = v => show(v), extra = null, color = i => i.color || '#888780' } = {}) {
  if (!items.length) return `<p class="empty">No data yet</p>`;
  const max = Math.max(...items.map(value), 1);
  return items.map(i => {
    const v = value(i);
    const w = Math.max(1.5, (v / max) * 82);
    return `<div class="hb" style="--lw:${labelWidth}px">
      <span class="hb-label" title="${esc(i.label)}">${esc(i.label)}</span>
      <div class="hb-track"><div class="hb-fill" style="width:${w}%;background:${esc(color(i))}"></div><span class="hb-val">${format(v)}${extra ? `<span>${extra(i)}</span>` : ''}</span></div>
    </div>`;
  }).join('');
}

function ownerName(owner) {
  const key = String(owner || '').toLowerCase().replace(/[^a-z]/g, '');
  const r = RECRUITERS.find(x => key && key.startsWith(x.id));
  return r ? r.name : (owner || '—');
}

function tierStyle(t) {
  return `--tc:${esc(t.color || '#888')};--tb:${esc(t.bgLight || '#f1f1ed')}`;
}

// ---------------------------------------------------------------------------
// Aging: one stacked strip + five tier buttons. Clicking opens the drill-down.
// ---------------------------------------------------------------------------
const AGING_SETS = {};   // context key -> agingRecords

function agingBlock(tiers, records, ctx) {
  const total = tiers.reduce((a, t) => a + (t.count || 0), 0);
  if (records) AGING_SETS[ctx] = records;
  if (!total) return `<p class="empty">No aging data available yet</p>`;
  const segs = tiers.filter(t => t.count > 0).map(t =>
    `<button type="button" data-drill="${esc(ctx)}" data-band="${esc(t.label)}" style="flex:${t.count} 1 0;background:${esc(t.color)};color:${textOn(t.color)}" title="${esc(tierName(t.label))}: ${t.count}" aria-label="${esc(tierName(t.label))}: ${t.count} reqs">${t.count / total >= 0.06 ? t.count : ''}</button>`).join('');
  const chips = tiers.map(t =>
    `<button type="button" class="tier" style="${tierStyle(t)}" ${t.count > 0 && records ? `data-drill="${esc(ctx)}" data-band="${esc(t.label)}"` : 'disabled'}>
      <span class="tier-sw"></span><span><span class="tier-n">${show(t.count)}</span><br><span class="tier-l">${esc(tierName(t.label))}</span></span>
    </button>`).join('');
  return `<div class="strip" role="group" aria-label="Aging tiers">${segs}</div><div class="tiers">${chips}</div>`;
}

// ---------------------------------------------------------------------------
// Overview (leadership)
// ---------------------------------------------------------------------------
function renderOverview(data) {
  const s = data.summary || {};
  const agingTiers = data.mainAging || [];
  const agingTotal = agingTiers.reduce((a, t) => a + (t.count || 0), 0);

  const kpis = `<div class="kpis">
    <div class="kpi lead"><div class="kpi-label">Open Reqs ${tip('All requisitions currently open across every req type and campus.')}</div><div class="kpi-val">${show(s.openReqs)}</div><div class="kpi-sub">active pipeline</div></div>
    <div class="kpi"><div class="kpi-label">Avg TTF (Active) ${tip('Average days from posting to the time-to-fill stop (Pre-boarding), for the Active req type only.')}</div><div class="kpi-val">${days(s.avgTimeToFill)}</div><div class="kpi-sub">Active req type only</div></div>
    <div class="kpi"><div class="kpi-label">Filled YTD ${tip('Searches closed with a hire this year.')}</div><div class="kpi-val">${show(s.filledYTD)}</div><div class="kpi-sub">positions closed</div></div>
    <div class="kpi"><div class="kpi-label">Failed / Cancelled ${tip('Searches closed without a hire, either failed or cancelled by the department.')}</div><div class="kpi-val">${show(s.failedCancelled)}</div><div class="kpi-sub">searches, no hire</div></div>
    <div class="kpi"><div class="kpi-label">In Offer Stage ${tip('Reqs with an offer currently extended or in negotiation.')}</div><div class="kpi-val">${show(s.inOfferStage)}</div><div class="kpi-sub">active offers</div></div>
  </div>`;

  const aging = card('Aging at a glance',
    `<p class="scope">Active req type only (<b>${show(agingTotal)}</b> of <b>${show(s.openReqs)}</b> open reqs) · days since last stage change. Select a tier to see the reqs.</p>
     ${agingBlock(agingTiers, data.agingRecords || null, 'main')}`,
    { tip: 'Only the Active req type is aged. Passive, Faculty, Student, Evergreen and Targeted reqs follow their own monitoring workflows.' });

  const raw = data.mainFunnel || [];
  const byLabel = Object.fromEntries(raw.map(f => [f.label, f]));
  const funnel = [
    ...FUNNEL_ORDER.filter(l => byLabel[l] && byLabel[l].count > 0).map(l => byLabel[l]),
    // An unrecognised stage still shows up instead of vanishing.
    ...raw.filter(f => !FUNNEL_ORDER.includes(f.label) && !TYPE_CATEGORIES.includes(f.label) && f.count > 0)
  ];
  const types = raw.filter(f => TYPE_CATEGORIES.includes(f.label) && f.count > 0).sort((a, b) => b.count - a.count);

  const defs = `<details class="defs"><summary>Service level definitions</summary><dl>
    <dt>Passive</dt><dd>Basic support: posting, applicant disposition as they apply, offer assistance, and job offer processing. Also used for disposition or pipeline-building for a potential future need.</dd>
    <dt>Active</dt><dd>Premier support: includes Passive support plus candidate outreach, summaries, screening, interview scheduling, negotiation assistance, and onboarding follow-up.</dd>
    <dt>Evergreen</dt><dd>Ongoing/open-ended posting or talent pool for recurring hiring needs.</dd>
    <dt>Faculty</dt><dd>Academic faculty searches following faculty hiring process.</dd>
    <dt>Student</dt><dd>Student employment and OPS positions.</dd>
  </dl></details>`;

  const pipeline = `<div class="grid g-2-1">
    ${card('Pipeline', hbars(funnel, { labelWidth: 130 }), { note: 'Sequential stages only, in order.', tip: 'Where reqs sit in the hiring sequence right now. Backlog and service-type categories are shown separately.' })}
    ${card('Reqs by Type', hbars(types, { labelWidth: 205 }) + defs, { note: 'Service-level categories, not a sequence.' })}
  </div>`;

  const recruiters = data.recruiters || [];
  const load = recruiters.map(r => ({ label: r.name, count: r.activeReqs, color: r.color }));
  const campus = (data.campus || []).filter(c => c.count > 0);
  const campusTotal = campus.reduce((a, c) => a + c.count, 0);

  const team = `<div class="grid g-1-1">
    ${card('Team workload', load.some(l => l.count > 0) ? hbars(load, { labelWidth: 90, format: v => isNum(v) && v > 0 ? show(v) : '—' }) : `<p class="empty">No recruiter data yet</p>`,
      { note: 'Open reqs assigned to each recruiter. Workload, not performance.' })}
    ${card('Jobs by Campus', campusTotal ? hbars(campus, { labelWidth: 100, extra: c => `${Math.round(c.count / campusTotal * 100)}%` }) : `<p class="empty">No campus data yet</p>`,
      { note: 'Open reqs by campus.' })}
  </div>`;

  return `<div class="page-head"><div><h1 class="page-title">Recruiting overview</h1><p class="page-sub">USF Central Human Resources · all campuses</p></div></div>
    ${kpis}${aging}<div style="height:14px"></div>${pipeline}${team}
    <p class="footnote">These numbers reflect this dashboard's live pipeline, synced from Notion every 30 minutes. Power BI numbers may differ: it refreshes on its own schedule and can be filtered to a different subset (e.g. a single stage or date range), so the two aren't expected to match exactly.</p>`;
}

// ---------------------------------------------------------------------------
// Insights
// ---------------------------------------------------------------------------
function renderInsights(data) {
  const ins = data.insights || {};

  const stageMetrics = (data.stageMetrics || []).map(m => ({ ...m, color: m.color || stageColor(m.label) }));
  const timeInStage = stageMetrics.length
    ? hbars(stageMetrics, { labelWidth: 130, value: i => i.avgDays, format: v => `${v}d`, extra: i => reqs(i.count) })
    : `<p class="empty">No stage timing yet</p>`;

  const ttfType = (ins.avgTTFByReqType || []).map(i => ({ label: i.reqType, avgDays: i.avgDays, count: i.count }));
  const ttfCampus = (ins.avgTTFByCampus || []).map(i => ({ label: i.campus, avgDays: i.avgDays, count: i.count }));
  const ttfOpts = { labelWidth: 100, value: i => i.avgDays, format: v => `${v}d`, extra: i => reqs(i.count) };

  const fill = (ins.fillRateByDept || []).slice(0, 8);
  const fillHTML = fill.length ? fill.map(d => {
    const pct = d.fillRatePct;
    return `<div class="conv"><div class="conv-top"><span title="${esc(d.department)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72%">${esc(d.department)}</span><b>${pct == null ? 'N/A' : pct + '%'}</b></div>
      <div class="conv-bar"><div style="width:${pct || 0}%;background:var(--green)"></div></div>
      <div class="conv-sub">${show(d.filled)} filled, ${show(d.failed)} failed${d.cancelled ? `, ${show(d.cancelled)} cancelled (excluded from rate)` : ''}</div></div>`;
  }).join('') : `<p class="empty">No closed reqs yet</p>`;

  const topDepts = (ins.topHiringDepartments || []).slice(0, 8).map(d => ({ label: d.department, count: d.count, color: '#00A693' }));

  // Stall rate: alphabetical and one neutral colour, so it reads as information, not a ranking.
  const stallDays = ins.stallMinDays || ATTENTION_MIN_DAYS;
  const stall = (ins.stallRateByRecruiter || []).slice().sort((a, b) => String(a.recruiter).localeCompare(String(b.recruiter)));
  const stallHTML = stall.length ? stall.map(r => {
    const none = !r.totalActive;
    const w = none ? 0 : Math.max(1.5, (r.stallRatePct || 0) * 0.82);
    return `<div class="hb" style="--lw:90px"><span class="hb-label">${esc(r.recruiter)}</span>
      <div class="hb-track">${none ? '' : `<div class="hb-fill" style="width:${w}%;background:${NEUTRAL}"></div>`}<span class="hb-val">${none ? '<span style="margin:0">no Active reqs</span>' : `${r.stallRatePct}%<span>${show(r.stalled)} of ${show(r.totalActive)}</span>`}</span></div></div>`;
  }).join('') : `<p class="empty">No recruiter data yet</p>`;

  const seasonal = ins.seasonalHiringTrends || [];
  const maxS = Math.max(...seasonal.map(i => i.count), 1);
  const seasonalHTML = seasonal.length ? `<div class="cols">${seasonal.map(i =>
    `<div class="col"><span class="col-n">${show(i.count)}</span><div class="col-bar" style="height:${Math.max(3, Math.round(i.count / maxS * 120))}px"></div><span class="col-l">${esc(i.label)}</span></div>`).join('')}</div>`
    : `<p class="empty">No Posted Date data yet</p>`;

  return `<div class="page-head"><div><h1 class="page-title">Insights</h1><p class="page-sub">Internal market intelligence, built on our own recruiting data</p></div></div>
    <div class="grid g-1-1">
      ${card('Avg. time in stage', timeInStage, { note: 'Average days reqs spend in each stage.' })}
      ${card(`Reqs ${stallDays}+ days since last stage change`, stallHTML, { note: `Share of each recruiter's Active-type reqs that are ${stallDays}+ days past their last stage change.`, tip: 'Reflects the req mix each recruiter carries; it is not a performance score.' })}
    </div>
    <div class="grid g-3">
      ${card('Avg TTF by req type', hbars(ttfType, { ...ttfOpts, color: () => '#534AB7' }), { note: 'Hired/Complete reqs only.' })}
      ${card('Avg TTF by campus', hbars(ttfCampus, { ...ttfOpts, labelWidth: 110, color: () => '#1B6A9C' }), { note: 'Hired/Complete reqs only.' })}
      ${card('Top hiring departments', hbars(topDepts, { labelWidth: 150 }), { note: 'Total reqs opened, active + closed.' })}
    </div>
    ${card('Fill rate by department', `<div class="split">${fillHTML}</div>`, { note: 'Hired ÷ (Hired + Failed). Cancellations tracked separately.' })}
    <div style="height:14px"></div>
    ${card('Seasonal hiring trends', seasonalHTML, { note: "Reqs posted per month, from Posted Date. Same source field as Power BI's Recruitment Trend chart." })}`;
}

// ---------------------------------------------------------------------------
// Recruiter pages (daily use)
// ---------------------------------------------------------------------------
function attentionRecords(r) {
  // Oldest tier first; within a tier, keep the order from data.json.
  const bands = (r.agingRecords || []).slice().sort((a, b) => (tierMin(b.band) - tierMin(a.band)));
  const out = [];
  bands.forEach(b => (b.records || []).forEach(rec => out.push({ ...rec, _band: b, _min: tierMin(b.band) })));
  return out;
}

function tierMin(band) {
  const t = (DATA.mainAging || []).find(a => a.label === band);
  if (t && isNum(t.minDays)) return t.minDays;
  const m = /(\d+)/.exec(bandLabel(band));
  return m ? +m[1] : 0;
}

function rowHTML(rec, { showOwner = false } = {}) {
  const b = rec._band || {};
  const url = safeUrl(rec.notionUrl);
  const sc = stageColor(rec.stage);
  const meta = [rec.reqId ? '#' + rec.reqId : '', showOwner ? ownerName(rec.owner) : '', rec.campus, rec.department].filter(Boolean).map(esc).join(' · ');
  return `<div class="row" style="${tierStyle(b)}">
    <span class="row-band" aria-hidden="true"></span>
    <div class="row-main"><div class="row-title" title="${esc(rec.title)}">${esc(rec.title || 'Untitled')}</div><div class="row-meta">${meta || '&nbsp;'}</div></div>
    <div class="row-chips">
      <span class="chip stage-chip"><span class="chip-dot" style="background:${esc(sc)}"></span>${esc(rec.stage || '—')}</span>
      <span class="chip age-chip">${esc(tierName(b.band))}</span>
    </div>
    <div class="row-open">${url ? `<a class="btn btn-sm" href="${esc(url)}" target="_blank" rel="noopener">Open ↗</a>` : '<span class="row-meta">—</span>'}</div>
  </div>`;
}

function renderRecruiter(r) {
  const tracker = safeUrl(TRACKER_URLS[r.id]);
  const head = `<div class="rhead">
    <div class="avatar" style="background:${esc(r.bgLight || '#eee')};color:${esc(r.color || '#333')}">${esc(r.initials || '')}</div>
    <div><h1 class="rname">${esc(r.name)}</h1><div class="rsub">${esc(r.campus || '')}</div></div>
    ${tracker ? `<a class="btn" href="${esc(tracker)}" target="_blank" rel="noopener">Open My Tracker ↗</a>` : ''}
  </div>`;

  if (!(r.reqs > 0)) {
    return head + `<div class="card state"><b>No data yet</b>${esc(r.name)}'s requisitions will appear here once they're synced from Notion.</div>`;
  }

  return head + `<section class="card" id="attn-${esc(r.id)}" style="margin-bottom:14px">${attentionShell(r)}</section>
    <div class="kpis six">
      <div class="kpi"><div class="kpi-label">Total Reqs</div><div class="kpi-val">${show(r.reqs)}</div><div class="kpi-sub">all assigned</div></div>
      <div class="kpi lead"><div class="kpi-label">Open Reqs</div><div class="kpi-val">${show(r.activeReqs)}</div><div class="kpi-sub">active now</div></div>
      <div class="kpi"><div class="kpi-label">WIP ${tip('Reqs flagged as actively being worked.')}</div><div class="kpi-val">${show(r.wip)}</div><div class="kpi-sub">actively worked</div></div>
      <div class="kpi"><div class="kpi-label">Filled</div><div class="kpi-val">${show(r.filled)}</div><div class="kpi-sub">hired</div></div>
      <div class="kpi"><div class="kpi-label">Failed</div><div class="kpi-val">${show(r.failed)}</div><div class="kpi-sub">canceled / no hire</div></div>
      <div class="kpi"><div class="kpi-label">Avg TTF (Active)</div><div class="kpi-val">${days(r.ttf)}</div><div class="kpi-sub">Active req type only</div></div>
    </div>
    ${recruiterCharts(r)}`;
}

function attentionShell(r) {
  return `<div class="attn-head">
      <h2 class="card-title">Needs attention ${tip(`Active-type reqs ${ATTENTION_MIN_DAYS}+ days since their last stage change, oldest first. Switch to "All Active" to see every aged req.`)}</h2>
      <div class="seg" role="group" aria-label="Which reqs to show">
        <button type="button" data-scope="attn" data-rid="${esc(r.id)}" class="on">${ATTENTION_MIN_DAYS}+ days</button>
        <button type="button" data-scope="all" data-rid="${esc(r.id)}">All Active</button>
      </div>
    </div>
    <div class="filters">
      <input type="search" data-f="q" data-rid="${esc(r.id)}" placeholder="Search title, req ID or department" aria-label="Search reqs">
      <select data-f="stage" data-rid="${esc(r.id)}" aria-label="Filter by stage"></select>
      <select data-f="campus" data-rid="${esc(r.id)}" aria-label="Filter by campus"></select>
    </div>
    <div data-list="${esc(r.id)}"></div>`;
}

const PAGE_SIZE = 10;

function drawAttention(rid) {
  const r = RECRUITERS.find(x => x.id === rid);
  const host = document.getElementById('attn-' + rid);
  if (!r || !host) return;
  const st = pageState[rid] || (pageState[rid] = { scope: 'attn', q: '', stage: '', campus: '', limit: PAGE_SIZE });
  const all = attentionRecords(r);
  const inScope = st.scope === 'attn' ? all.filter(x => x._min >= ATTENTION_MIN_DAYS) : all;

  // Filter options come from what's in scope, so every option returns something.
  const fill = (sel, values, allLabel) => {
    const cur = sel.value;
    sel.innerHTML = `<option value="">${allLabel}</option>` + values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
    sel.value = values.includes(cur) ? cur : '';
  };
  const stageSel = host.querySelector('[data-f="stage"]');
  const campusSel = host.querySelector('[data-f="campus"]');
  fill(stageSel, [...new Set(inScope.map(x => x.stage).filter(Boolean))].sort(), 'All stages');
  fill(campusSel, [...new Set(inScope.map(x => x.campus).filter(Boolean))].sort(), 'All campuses');
  st.stage = stageSel.value; st.campus = campusSel.value;

  const q = st.q.toLowerCase();
  const shown = inScope.filter(x =>
    (!st.stage || x.stage === st.stage) &&
    (!st.campus || x.campus === st.campus) &&
    (!q || [x.title, x.reqId, x.department, x.stage, x.campus].some(v => String(v || '').toLowerCase().includes(q))));

  host.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.scope === st.scope));
  const filtered = st.q || st.stage || st.campus;
  const list = host.querySelector('[data-list]');

  host.querySelector('.seg').style.display = all.length ? '' : 'none';
  if (!all.length) {
    host.querySelector('.filters').style.display = 'none';
    list.innerHTML = `<div class="state"><b>No Active-type reqs assigned</b>Passive, Faculty, Student, Evergreen and Targeted reqs follow their own monitoring workflows and aren't aged here.</div>`;
    return;
  }
  host.querySelector('.filters').style.display = '';
  if (!inScope.length) {
    list.innerHTML = `<div class="state"><b>Nothing ${ATTENTION_MIN_DAYS}+ days old</b>All ${show(all.length)} Active-type reqs had a stage change within the last ${ATTENTION_MIN_DAYS - 1} days.</div>`;
    return;
  }
  const count = `<p class="attn-count" style="margin-bottom:10px"><b>${show(shown.length)}</b> ${filtered ? `of ${show(inScope.length)} ` : ''}req${shown.length === 1 ? '' : 's'}${st.scope === 'attn' ? ` ${ATTENTION_MIN_DAYS}+ days since last stage change` : ' (Active type)'}</p>`;
  if (!shown.length) {
    list.innerHTML = count + `<div class="list"><div class="state">No reqs match these filters.</div></div>`;
    return;
  }
  const page = shown.slice(0, st.limit);
  list.innerHTML = count + `<div class="list">${page.map(x => rowHTML(x)).join('')}
    ${shown.length > page.length ? `<button type="button" class="more" data-more="${esc(rid)}">Show ${Math.min(PAGE_SIZE, shown.length - page.length)} more (${show(shown.length - page.length)} remaining)</button>` : ''}</div>`;
}

function recruiterCharts(r) {
  const agingTiers = (r.agingRecords || []).map(b => ({ label: b.band, count: (b.records || []).length, color: b.color, bgLight: b.bgLight }));
  const hasAging = agingTiers.some(t => t.count > 0);
  const statuses = (r.statuses || []).map(s => ({ ...s, color: s.color || stageColor(s.label) }));
  const stageMetrics = (r.stageMetrics || []).map(s => ({ ...s, color: s.color || stageColor(s.label) }));

  const aging = hasAging
    ? card('Aging tiers', `<p class="scope">Your Active-type reqs only · days since last stage change. Select a tier to see the reqs.</p>${agingBlock(agingTiers, r.agingRecords, r.id)}`)
    : '';
  const cards = [card('Pipeline by status', hbars(statuses, { labelWidth: 200 }))];
  if (stageMetrics.length) {
    cards.push(card('Avg. time in stage', hbars(stageMetrics, { labelWidth: 130, value: i => i.avgDays, format: v => `${v}d`, extra: i => reqs(i.count) })));
  }
  let html = (aging ? aging + '<div style="height:14px"></div>' : '') + `<div class="grid g-1-1">${cards.join('')}</div>`;
  return html;
}

// ---------------------------------------------------------------------------
// Drill-down sheet
// ---------------------------------------------------------------------------
let drill = { recs: [], ctx: null, opener: null };

function openDrill(ctx, band, opener) {
  const sets = AGING_SETS[ctx];
  if (!sets) return;
  const norm = s => String(s).replace(/–/g, '-');
  const b = sets.find(x => x.band === band || norm(x.band) === norm(band));
  if (!b) return;
  drill = { recs: (b.records || []).map(rec => ({ ...rec, _band: b })), ctx, opener };
  const who = ctx === 'main' ? '' : ((RECRUITERS.find(r => r.id === ctx) || {}).name || '') + ' · ';
  document.getElementById('sheetTitle').textContent = who + tierName(b.band) + ' since last stage change';
  document.getElementById('sheetSearch').value = '';
  drawDrill();
  document.getElementById('scrim').classList.add('open');
  const sheet = document.getElementById('sheet');
  sheet.classList.add('open');
  sheet.setAttribute('aria-hidden', 'false');
  document.getElementById('sheetClose').focus();
}

function drawDrill() {
  const q = document.getElementById('sheetSearch').value.toLowerCase().trim();
  const recs = q ? drill.recs.filter(r => [r.title, r.reqId, ownerName(r.owner), r.owner, r.campus, r.stage, r.department].some(v => String(v || '').toLowerCase().includes(q))) : drill.recs;
  const n = drill.recs.length;
  document.getElementById('sheetSub').textContent = q ? `${recs.length} of ${n} reqs` : `${n} requisition${n === 1 ? '' : 's'} in this tier`;
  document.getElementById('sheetBody').innerHTML = recs.length
    ? `<div class="list">${recs.map(r => rowHTML(r, { showOwner: drill.ctx === 'main' })).join('')}</div>`
    : `<div class="state">No reqs match your filter.</div>`;
}

function closeDrill() {
  const sheet = document.getElementById('sheet');
  if (!sheet.classList.contains('open')) return;
  sheet.classList.remove('open');
  sheet.setAttribute('aria-hidden', 'true');
  document.getElementById('scrim').classList.remove('open');
  if (drill.opener && document.contains(drill.opener)) drill.opener.focus();
}

// ---------------------------------------------------------------------------
// Routing: the URL hash is the single source of truth (#main, #insights, #<recruiterId>)
// ---------------------------------------------------------------------------
function parseRoute(hash) {
  const id = decodeURIComponent((hash || '').replace(/^#\/?/, '')).toLowerCase();
  if (id === 'main' || id === 'insights') return id;
  if (id === 'recruiters') return lastRecruiterId || (RECRUITERS[0] && RECRUITERS[0].id) || 'main';
  if (RECRUITERS.some(r => r.id === id)) return id;
  return 'main';
}

function showRoute(route) {
  closeDrill();
  const rec = RECRUITERS.find(r => r.id === route);
  if (rec) lastRecruiterId = rec.id;
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('show', p.id === 'page-' + route));
  const tabId = rec ? 'recruiters' : route;
  document.querySelectorAll('.tab').forEach(t => {
    const on = t.dataset.tab === tabId;
    t.classList.toggle('active', on);
    if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
  const recTab = document.querySelector('.tab[data-tab="recruiters"]');
  if (recTab) recTab.setAttribute('href', '#' + (lastRecruiterId || (RECRUITERS[0] && RECRUITERS[0].id) || 'recruiters'));
  document.getElementById('recruiterPicker').classList.toggle('open', !!rec);
  document.querySelectorAll('.pill').forEach(p => {
    const on = p.dataset.id === route;
    p.classList.toggle('active', on);
    if (on) { p.setAttribute('aria-current', 'page'); p.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
    else p.removeAttribute('aria-current');
  });
  document.title = (rec ? rec.name + ' — ' : route === 'insights' ? 'Insights — ' : '') + 'CHR Recruiting Dashboard';
}

function routeFromLocation() {
  const route = parseRoute(location.hash);
  if (location.hash.toLowerCase() === '#recruiters') history.replaceState(null, '', '#' + route);
  showRoute(route);
}

// ---------------------------------------------------------------------------
// Events (delegated, so re-renders never lose handlers)
// ---------------------------------------------------------------------------
function wireEvents() {
  document.addEventListener('click', e => {
    const d = e.target.closest('[data-drill]');
    if (d) { openDrill(d.dataset.drill, d.dataset.band, d); return; }
    const seg = e.target.closest('[data-scope]');
    if (seg) { const st = pageState[seg.dataset.rid]; st.scope = seg.dataset.scope; st.limit = PAGE_SIZE; drawAttention(seg.dataset.rid); return; }
    const more = e.target.closest('[data-more]');
    if (more) { pageState[more.dataset.more].limit += PAGE_SIZE; drawAttention(more.dataset.more); return; }
    if (e.target.closest('#sheetClose') || e.target.id === 'scrim') closeDrill();
  });
  document.addEventListener('input', e => {
    const f = e.target.closest('[data-f]');
    if (f) { const st = pageState[f.dataset.rid]; st[f.dataset.f] = f.value; st.limit = PAGE_SIZE; drawAttention(f.dataset.rid); }
    if (e.target.id === 'sheetSearch') drawDrill();
  });
  document.addEventListener('change', e => {
    const f = e.target.closest('select[data-f]');
    if (f) { const st = pageState[f.dataset.rid]; st[f.dataset.f] = f.value; st.limit = PAGE_SIZE; drawAttention(f.dataset.rid); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrill(); });
  window.addEventListener('hashchange', routeFromLocation);
  // Closed <details> don't print, so open the definitions before printing.
  window.addEventListener('beforeprint', () => document.querySelectorAll('details.defs').forEach(d => { d.open = true; }));
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
function buildStageColors(data) {
  const add = list => (list || []).forEach(x => { if (x && x.label && x.color && !STAGE_COLOR[x.label]) STAGE_COLOR[x.label] = x.color; });
  add(data.mainFunnel); add(data.stageMetrics);
  (data.recruiters || []).forEach(r => { add(r.statuses); add(r.stageMetrics); });
}

async function loadDashboard() {
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    DATA = data;
    RECRUITERS = data.recruiters || [];
    buildStageColors(data);

    document.getElementById('pickerInner').innerHTML = '<span class="picker-label">Recruiter</span>' + RECRUITERS.map(r =>
      `<a class="pill" href="#${esc(r.id)}" data-id="${esc(r.id)}" style="--pc:${esc(r.color || '#1B6A9C')};--pb:${esc(r.bgLight || '#e6f0f7')}"><span class="pill-dot">${esc(r.initials || '')}</span>${esc(r.name)}</a>`).join('');

    const content = document.getElementById('content');
    content.innerHTML =
      `<div class="page" id="page-main">${renderOverview(data)}</div>` +
      `<div class="page" id="page-insights">${renderInsights(data)}</div>` +
      RECRUITERS.map(r => `<div class="page" id="page-${esc(r.id)}">${renderRecruiter(r)}</div>`).join('');
    RECRUITERS.forEach(r => { if (r.reqs > 0) drawAttention(r.id); });

    document.getElementById('syncBadge').textContent = 'Synced: ' + fmtSync(data.lastUpdated);
    wireEvents();
    routeFromLocation();
  } catch (err) {
    document.getElementById('content').innerHTML = `<div class="error-box">
      Couldn't load <code>data.json</code> (${esc(err.message)}). Make sure it sits next to this page.
      On GitHub Pages this loads automatically; opening the file directly with <code>file://</code> blocks fetch,
      so run a local server (<code>python3 -m http.server</code>) to preview.</div>`;
    document.getElementById('syncBadge').textContent = 'Sync error';
  }
}

loadDashboard();
</script>
